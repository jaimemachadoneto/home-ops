---
# The variables that each Flux Kustomization of the namespace reads with
# postBuild.substituteFrom. They come from 1Password, so the domain is not in git.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cluster-secrets
  data:
    - secretKey: SECRET_DOMAIN
      remoteRef:
        key: cluster-secrets
        property: SECRET_DOMAIN
    - secretKey: TIMEZONE
      remoteRef:
        key: cluster-secrets
        property: TIMEZONE
