---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: ${APP}
            # The patch body needs apiVersion. With only version, kustomize
            # adds a field version to the Deployment, and the API server
            # refuses the create of a new Deployment.
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ${APP}
                labels:
                  autoscale.keda.io/nfs: "true"
              spec:
                template:
                  metadata:
                    labels:
                      autoscale.keda.io/nfs: "true"
