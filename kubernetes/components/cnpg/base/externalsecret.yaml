---
# The MinIO keys of the NAS, the same as the keys of postgres16.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_NAME:=${APP}}-postgres-objectstore
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${CNPG_NAME:=${APP}}-postgres-objectstore
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: s3
        property: s3-key
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: s3
        property: s3-secret
---
# The password of the database owner stays in 1Password, where the app reads
# it too. The cluster sets it on the owner role at the import and at each
# recovery, so a restore does not change the password of the app.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${CNPG_NAME:=${APP}}-postgres-owner
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${CNPG_NAME:=${APP}}-postgres-owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ${CNPG_OWNER}
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ${CNPG_PASSWORD_ITEM}
        property: ${CNPG_PASSWORD_PROPERTY}
