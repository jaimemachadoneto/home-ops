---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${CNPG_NAME:=${APP}}-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: ${CNPG_NAME:=${APP}}-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
