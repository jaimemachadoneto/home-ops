---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP}-postgres
spec:
  backupOwnerReference: self
  cluster:
    name: ${APP}-postgres
  # The first backup starts at once, so a recovery has a base backup.
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Six fields: the first one is the second, not the minute.
  schedule: ${CNPG_BACKUP_SCHEDULE:="0 0 2 * * *"}
