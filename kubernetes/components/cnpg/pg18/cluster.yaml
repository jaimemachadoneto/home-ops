---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-postgres
  annotations:
    # Each new cluster restores from this path and then archives into it, so
    # the path is never empty. Without this annotation, the archive refuses it.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  # A new cluster always restores from its backup and never starts empty.
  # CNPG reads `bootstrap` only when it creates the cluster, so this does
  # nothing to a running cluster. To restore, delete the Cluster and its PVCs.
  bootstrap:
    recovery:
      source: ${APP}-postgres
      database: ${CNPG_DATABASE}
      owner: ${CNPG_OWNER}
      secret:
        name: ${APP}-postgres-owner
  enablePDB: ${CNPG_PDB:=false}
  enableSuperuserAccess: false
  externalClusters:
    - name: ${APP}-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ${APP}-postgres
          serverName: ${APP}-postgres-pg18
  # The standard image has pgvector, which paperless_mcp and obsidian_mcp need.
  # A major upgrade does not change this file: see pg18/kustomization.yaml.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  instances: ${CNPG_INSTANCES:=1}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-postgres
        serverName: ${APP}-postgres-pg18
  postgresql:
    parameters:
      max_slot_wal_keep_size: 2GB
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: ${CNPG_CPU_REQUEST:=50m}
      memory: ${CNPG_MEMORY_REQUEST:=256Mi}
    limits:
      memory: ${CNPG_MEMORY_LIMIT:=1Gi}
  storage:
    size: ${CNPG_CAPACITY:=5Gi}
    storageClass: openebs-hostpath
