---
# yaml-language-server: $schema=https://json.schemastore.org/component.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The Postgres major version is the name of this folder. A major upgrade copies
# the folder to ../pg19 and changes one line in the ks.yaml of the app.
# The cluster is ${CNPG_NAME}-postgres. CNPG_NAME is ${APP} when the app does
# not set it. Set it when the database has a different name than the app, for
# example the obsidian-mcp container in the syncthing pod.
components:
  - ../base
resources:
  - ./cluster.yaml
