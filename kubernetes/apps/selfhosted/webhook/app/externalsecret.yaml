---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: webhook-secret
    creationPolicy: Owner
  dataFrom:
    # The item `webhook` has two fields: GITHUB_WEBHOOK_SECRET (GitHub to this
    # server) and DOCO_CD_WEBHOOK_SECRET (this server to doco-cd). They are
    # separate, so a leak of one does not give the other.
    - extract:
        key: webhook
