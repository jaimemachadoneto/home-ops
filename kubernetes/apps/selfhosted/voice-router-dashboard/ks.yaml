---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: voice-router-dashboard
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: voice-router-dashboard
  interval: 1h
  path: "./kubernetes/apps/selfhosted/voice-router-dashboard/app"
  postBuild:
    substitute:
      APP: voice-router-dashboard
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
