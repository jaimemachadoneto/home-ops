---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: authentik
  # The cluster authentik-postgres holds the database (components/cnpg).
  # ../postgres sets its connection limits.
  components:
    - ../../../../components/cnpg/pg18
    - ../postgres
  dependsOn:
    - name: cloudnative-pg-barman-cloud
      namespace: database
  interval: 30m
  path: ./kubernetes/apps/selfhosted/authentik/app
  postBuild:
    substitute:
      APP: *app
      CNPG_DATABASE: authentik
      CNPG_INSTANCES: "2"
      CNPG_OWNER: user
      CNPG_PASSWORD_ITEM: authentik
      CNPG_PASSWORD_PROPERTY: POSTGRES_PASSWORD
      CNPG_PDB: "true"
      # The backup of the 290 MB litellm database ran out of memory at 256Mi.
      CNPG_SIDECAR_MEMORY_LIMIT: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
---
# Envoy Gateway SecurityPolicies that put routes behind Authentik, one per
# namespace (forward-auth/<namespace>.yaml). Not namespaced by Flux: each
# policy must live in its route's namespace.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik-forward-auth
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authentik
  interval: 30m
  path: ./kubernetes/apps/selfhosted/authentik/forward-auth
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
