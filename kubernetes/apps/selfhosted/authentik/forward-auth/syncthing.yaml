---
# The Syncthing web UI and REST API. The same as ./selfhosted.yaml, but the
# outpost also gets the Authorization header: syncthing-join in nix-config
# signs in as the service account "syncthing-join" with HTTP Basic auth (an
# app password). See docs/syncthing.md.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authentik-forward-auth-syncthing
  namespace: selfhosted
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: syncthing
  extAuth:
    headersToExtAuth:
      - cookie
      - authorization
    http:
      backendRefs:
        - name: authentik-server
          namespace: selfhosted
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - x-authentik-username
        - x-authentik-groups
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
