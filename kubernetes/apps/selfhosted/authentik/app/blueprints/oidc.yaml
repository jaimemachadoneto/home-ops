# Apps that sign in with Authentik over OpenID Connect (their own login
# button), as opposed to forward auth in forward-auth.yaml.
#
# Managed by GitOps: Authentik applies this file on start and whenever it
# changes; edits made in the Authentik UI to these objects are overwritten.
# Client IDs and secrets come from the app's 1Password item, through
# authentik-secret (see externalsecret.yaml), as environment variables.
version: 1
metadata:
  name: home-ops oidc
  labels:
    blueprints.goauthentik.io/description: OIDC applications, managed in git
entries:
  # --- Paperless ---------------------------------------------------------------
  # Same client as Paperless's PAPERLESS_SOCIALACCOUNT_PROVIDERS (1Password
  # item Paperless, field social_account); the slug must stay "paperless",
  # it is part of the issuer URL Paperless uses.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-paperless
    identifiers:
      name: paperless
    attrs:
      client_type: confidential
      client_id: !Env PAPERLESS_OIDC_CLIENT_ID
      client_secret: !Env PAPERLESS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://paperless.${SECRET_DOMAIN}/accounts/oidc/authentik/login/callback/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    identifiers:
      slug: paperless
    attrs:
      name: Paperless
      provider: !KeyOf provider-paperless
      meta_launch_url: https://paperless.${SECRET_DOMAIN}
      policy_engine_mode: any

  # --- Browser sessions (selfhosted/browser-sessions) --------------------------
  # Signs in to the admin UI at /admin. Agents use per-session bearer tokens on
  # /<session>/mcp and never come here. Who may sign in is BWS_ADMIN_EMAILS in
  # the app (1Password item browser-sessions), checked after Authentik.
  # The slug must stay "browser-sessions": it is part of the issuer URL
  # (BWS_OIDC_ISSUER in the app's HelmRelease).
  #
  # The app refuses an ID token whose email_verified is false. Accounts here
  # are created by the admin, so this provider vouches for their email itself
  # rather than depending on what the default email mapping says about it.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-browser-sessions-email
    identifiers:
      name: browser-sessions email
    attrs:
      scope_name: email
      description: Your email address
      expression: |
        return {"email": request.user.email, "email_verified": True}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-browser-sessions
    identifiers:
      name: browser-sessions
    attrs:
      client_type: confidential
      client_id: browser-sessions
      client_secret: !Env BROWSER_SESSIONS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://bwsessions.${SECRET_DOMAIN}/admin/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-browser-sessions-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    identifiers:
      slug: browser-sessions
    attrs:
      name: Browser Sessions
      provider: !KeyOf provider-browser-sessions
      meta_launch_url: https://bwsessions.${SECRET_DOMAIN}/admin
      policy_engine_mode: any
