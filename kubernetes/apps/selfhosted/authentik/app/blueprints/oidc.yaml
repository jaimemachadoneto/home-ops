# Apps that sign in with Authentik over OpenID Connect (their own login
# button), as opposed to forward auth in forward-auth.yaml.
#
# Managed by GitOps: Authentik applies this file on start and whenever it
# changes; edits made in the Authentik UI to these objects are overwritten.
# Client IDs and secrets come from the app's 1Password item, through
# authentik-secret (see externalsecret.yaml), as environment variables.
version: 1
metadata:
  name: home-ops oidc
  labels:
    blueprints.goauthentik.io/description: OIDC applications, managed in git
entries:
  # --- Paperless ---------------------------------------------------------------
  # Same client as Paperless's PAPERLESS_SOCIALACCOUNT_PROVIDERS (1Password
  # item Paperless, field social_account); the slug must stay "paperless",
  # it is part of the issuer URL Paperless uses.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-paperless
    identifiers:
      name: paperless
    attrs:
      client_type: confidential
      client_id: !Env PAPERLESS_OIDC_CLIENT_ID
      client_secret: !Env PAPERLESS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://paperless.${SECRET_DOMAIN}/accounts/oidc/authentik/login/callback/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    identifiers:
      slug: paperless
    attrs:
      name: Paperless
      provider: !KeyOf provider-paperless
      meta_launch_url: https://paperless.${SECRET_DOMAIN}
      policy_engine_mode: any

  # --- Browser sessions (selfhosted/browser-sessions) --------------------------
  # Signs in to the admin UI at /admin. Agents use per-session bearer tokens on
  # /<session>/mcp and never come here. Who may sign in is BWS_ADMIN_EMAILS in
  # the app (1Password item browser-sessions), checked after Authentik.
  # The slug must stay "browser-sessions": it is part of the issuer URL
  # (BWS_OIDC_ISSUER in the app's HelmRelease).
  #
  # The app refuses an ID token whose email_verified is false. Accounts here
  # are created by the admin, so this provider vouches for their email itself
  # rather than depending on what the default email mapping says about it.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-browser-sessions-email
    identifiers:
      name: browser-sessions email
    attrs:
      scope_name: email
      description: Your email address
      expression: |
        return {"email": request.user.email, "email_verified": True}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-browser-sessions
    identifiers:
      name: browser-sessions
    attrs:
      client_type: confidential
      client_id: browser-sessions
      client_secret: !Env BROWSER_SESSIONS_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://bwsessions.${SECRET_DOMAIN}/admin/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-browser-sessions-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    identifiers:
      slug: browser-sessions
    attrs:
      name: Browser Sessions
      provider: !KeyOf provider-browser-sessions
      meta_launch_url: https://bwsessions.${SECRET_DOMAIN}/admin
      policy_engine_mode: any

  # --- LiteLLM (ai/litellm) ---------------------------------------------------
  # Dashboard sign-in at https://litellm.${SECRET_DOMAIN}/ui. The API and MCP
  # gateway use LiteLLM keys and never come here. Only authentik Admins may
  # sign in (binding below): a LiteLLM account reaches the models and every
  # MCP server, Outlook included. LiteLLM maps the litellm_role claim
  # (GENERIC_USER_ROLE_ATTRIBUTE) to its roles.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-litellm-profile
    identifiers:
      name: litellm profile
    attrs:
      scope_name: profile
      description: Your name and role in LiteLLM
      expression: |
        return {
            "name": request.user.name,
            "preferred_username": request.user.username,
            "litellm_role": "proxy_admin" if ak_is_group_member(request.user, name="authentik Admins") else "internal_user",
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-litellm
    identifiers:
      name: litellm
    attrs:
      client_type: confidential
      client_id: litellm
      client_secret: !Env LITELLM_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://litellm.${SECRET_DOMAIN}/sso/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope-litellm-profile
      sub_mode: hashed_user_id
  - model: authentik_core.application
    id: app-litellm
    identifiers:
      slug: litellm
    attrs:
      name: LiteLLM
      provider: !KeyOf provider-litellm
      meta_launch_url: https://litellm.${SECRET_DOMAIN}/ui
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-litellm
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # --- Open WebUI (selfhosted/openwebui) --------------------------------------
  # Sign-in at https://ai.${SECRET_DOMAIN}. Any signed-in user gets an account
  # (DEFAULT_USER_ROLE: user in the app's HelmRelease); grant admin from the
  # app's own Admin Panel if needed.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-openwebui
    identifiers:
      name: openwebui
    attrs:
      client_type: confidential
      client_id: openwebui
      client_secret: !Env OPENWEBUI_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://ai.${SECRET_DOMAIN}/oauth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    identifiers:
      slug: openwebui
    attrs:
      name: Open WebUI
      provider: !KeyOf provider-openwebui
      meta_launch_url: https://ai.${SECRET_DOMAIN}
      policy_engine_mode: any

  # --- Grafana (observability/grafana) ----------------------------------------
  # Sign-in at https://grafana.${SECRET_DOMAIN}. Only authentik Admins may sign
  # in (binding below): the dashboards show the cluster logs and the LiteLLM
  # spend. GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH in Grafana also reads the
  # groups claim and gives Viewer to a user outside that group. The local admin
  # login stays as a fallback.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers:
      name: grafana
    attrs:
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      # A provider that a blueprint creates gets no grant types, and Authentik
      # then refuses the sign-in ("The request is otherwise malformed"). The
      # older providers got all grant types from the migration.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.${SECRET_DOMAIN}/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    id: app-grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: https://grafana.${SECRET_DOMAIN}
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-grafana
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # --- Audiobookshelf (media/audiobookshelf) ----------------------------------
  # The OIDC settings live in the app's own database (Settings > Authentication),
  # not in git. The slug must stay "audiobookshelf": it is part of the issuer
  # URL. The app serves under /audiobookshelf (its ROUTER_BASE_PATH), so the
  # redirect URIs start with it. The second one is for the mobile app.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-audiobookshelf
    identifiers:
      name: audiobookshelf
    attrs:
      client_type: confidential
      client_id: audiobookshelf
      client_secret: !Env AUDIOBOOKSHELF_OIDC_CLIENT_SECRET
      # See Grafana: a provider that a blueprint creates gets no grant types.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://audiobookshelf.${SECRET_DOMAIN}/audiobookshelf/auth/openid/callback
        - matching_mode: strict
          url: https://audiobookshelf.${SECRET_DOMAIN}/audiobookshelf/auth/openid/mobile-redirect
      # The app matches a user by email only when email_verified is true. The
      # default email mapping sends false, so use the browser-sessions one. It
      # vouches for every email, so only authentik Admins may sign in (binding
      # below), and users cannot change their own email in Authentik.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-browser-sessions-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    id: app-audiobookshelf
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      provider: !KeyOf provider-audiobookshelf
      meta_launch_url: https://audiobookshelf.${SECRET_DOMAIN}
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-audiobookshelf
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # --- Booklore (media/booklore) ----------------------------------------------
  # The browser runs the sign-in (authorization code with PKCE), so the client
  # is public and has no secret. The OIDC settings live in the app's own
  # database (Settings > Authentication), not in git. The slug must stay
  # "booklore": it is part of the issuer URL.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-booklore
    identifiers:
      name: booklore
    attrs:
      client_type: public
      client_id: booklore
      # See Grafana: a provider that a blueprint creates gets no grant types.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://booklore.${SECRET_DOMAIN}/oauth2-callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    id: app-booklore
    identifiers:
      slug: booklore
    attrs:
      name: Booklore
      provider: !KeyOf provider-booklore
      meta_launch_url: https://booklore.${SECRET_DOMAIN}
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-booklore
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30

  # --- Hermes (ai/hermes) -----------------------------------------------------
  # The Webapp and the Dashboard share one client, each with its own callback.
  # Hermes adds PKCE to the client secret. Only authentik Admins may sign in
  # (binding below): each user that signs in gets a shell in the agent. The
  # slug must stay "hermes": it is part of the issuer URL in
  # ai/hermes/app/resources/config.yaml.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-hermes
    identifiers:
      name: hermes
    attrs:
      client_type: confidential
      client_id: hermes
      client_secret: !Env HERMES_OIDC_CLIENT_SECRET
      # See Grafana: a provider that a blueprint creates gets no grant types.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://hermes.${SECRET_DOMAIN}/api/auth/oidc/callback
        - matching_mode: strict
          url: https://hermes.${SECRET_DOMAIN}/auth/callback
        - matching_mode: strict
          url: https://hermes-dash.${SECRET_DOMAIN}/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      sub_mode: hashed_user_id
  - model: authentik_core.application
    id: app-hermes
    identifiers:
      slug: hermes
    attrs:
      name: Hermes
      provider: !KeyOf provider-hermes
      meta_launch_url: https://hermes.${SECRET_DOMAIN}
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-hermes
      group: !Find [authentik_core.group, [name, authentik Admins]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
