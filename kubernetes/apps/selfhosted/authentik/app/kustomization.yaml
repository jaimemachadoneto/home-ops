---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./helmrepository.yaml
  - ./httproute-override.yaml
  - ./referencegrant.yaml
configMapGenerator:
  # Mounted into Authentik by the HelmRelease (blueprints.configMaps); Flux
  # substitutes ${SECRET_DOMAIN} in it.
  - name: authentik-blueprints
    files:
      - blueprints/forward-auth.yaml
generatorOptions:
  disableNameSuffixHash: true
