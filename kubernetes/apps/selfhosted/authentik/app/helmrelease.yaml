---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chart:
    spec:
      chart: authentik
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: selfhosted
      version: 2025.12.4
  install:
    remediation:
      retries: 3
  interval: 25m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Providers, applications and the embedded outpost's providers are managed
    # in git: see blueprints/forward-auth.yaml.
    blueprints:
      configMaps:
        - authentik-blueprints
    authentik:
      redis:
        host: dragonfly.database.svc.cluster.local
    global:
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: &secret authentik-secret
      # Reloader reads Deployment annotations (it ignored the old podAnnotations).
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: *secret
    server:
      # The embedded outpost runs in the server: with forward auth in front of
      # apps, one server pod down would lock them all out.
      replicas: 2
      pdb:
        enabled: true
        minAvailable: 1
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/component: server
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      initContainers:
        - envFrom:
            - secretRef:
                name: *secret
          image: ghcr.io/rafaribe/postgres-init:16
          name: init-db
      route:
        main:
          enabled: true
          hostnames:
            - sso.${SECRET_DOMAIN}
          annotations:
            external-dns.alpha.kubernetes.io/target: ingress-ext.${SECRET_DOMAIN}
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Authentik
            gethomepage.dev/group: Infrastructure
            gethomepage.dev/icon: si-grafana.svg
            gethomepage.dev/name: SSO
            gethomepage.dev/app: authentik
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-internal
              namespace: network
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-external
              namespace: network
              sectionName: https
      # extraEnv:
      #   - name: DJANGO_SESSION_COOKIE_DOMAIN
      #     value: "${SECRET_DOMAIN}"
      #   - name: DJANGO_CSRF_COOKIE_DOMAIN
      #     value: "${SECRET_DOMAIN}"
      #   - name: DJANGO_SESSION_COOKIE_SAMESITE
      #     value: "None"
      #   - name: DJANGO_SESSION_COOKIE_SECURE
      #     value: "true"
      #   - name: DJANGO_CSRF_COOKIE_SAMESITE
      #     value: "None"
      #   - name: DJANGO_CSRF_COOKIE_SECURE
      #     value: "true"
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    worker:
      replicas: 1
      # Blueprints are discovered when the worker starts. Recreate (not a
      # rolling update) so the new worker, which has the updated blueprint
      # ConfigMap mounted, is the one that runs that discovery; reload it when
      # the ConfigMap changes so blueprint edits apply right away.
      deploymentStrategy:
        type: Recreate
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: *secret
        configmap.reloader.stakater.com/reload: authentik-blueprints
      serviceAccount:
        create: true
      pdb:
        enabled: false
        minAvailable: 1
        maxUnavailable: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1.5Gi
    prometheus:
      rules:
        enabled: true

    postgresql:
      enabled: false
    redis:
      enabled: false
