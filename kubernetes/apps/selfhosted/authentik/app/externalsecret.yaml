---
# Fixed Authentik configuration with consistent cookie settings
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-secret
  namespace: selfhosted
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The cluster authentik-postgres (components/cnpg). Its owner is the
        # role user (CNPG_OWNER in ks.yaml), with the same password field.
        AUTHENTIK_POSTGRESQL__HOST: authentik-postgres-rw.selfhosted.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: authentik
        AUTHENTIK_POSTGRESQL__USER: user
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .BOOTSTRAP_EMAIL }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .BOOTSTRAP_TOKEN }}"
        AUTHENTIK_SECRET_KEY: "{{ .SECRET_KEY }}"
        # Cookie settings - use consistent domain
        # AUTHENTIK_COOKIE_DOMAIN: "${SECRET_DOMAIN}"
        # SESSION_COOKIE_DOMAIN: "${SECRET_DOMAIN}"
        # CSRF_COOKIE_DOMAIN: "${SECRET_DOMAIN}"
        # SESSION_COOKIE_SAMESITE: "None"
        # CSRF_COOKIE_SAMESITE: "None"
        # SESSION_COOKIE_SECURE: "true"
        # CSRF_COOKIE_SECURE: "true"
        # OIDC clients for blueprints/oidc.yaml (read there with !Env). Paperless
        # keeps its client inside the JSON of its social_account field.
        PAPERLESS_OIDC_CLIENT_ID: "{{ ((.paperless_social_account | fromYaml).openid_connect.APPS | first).client_id }}"
        PAPERLESS_OIDC_CLIENT_SECRET: "{{ ((.paperless_social_account | fromYaml).openid_connect.APPS | first).secret }}"
        # The same field browser-sessions' own ExternalSecret reads.
        BROWSER_SESSIONS_OIDC_CLIENT_SECRET: "{{ .browser_sessions_oidc_client_secret }}"
        # The same field LiteLLM's ExternalSecret reads (GENERIC_CLIENT_SECRET).
        LITELLM_OIDC_CLIENT_SECRET: "{{ .litellm_oidc_client_secret }}"
        # The same field openwebui's own ExternalSecret reads (OIDC_CLIENT_SECRET).
        OPENWEBUI_OIDC_CLIENT_SECRET: "{{ .openwebui_OIDC_CLIENT_SECRET }}"
        # The same field Grafana's own ExternalSecret reads (oidc-client-secret).
        GRAFANA_OIDC_CLIENT_SECRET: "{{ .grafana_oidc_client_secret }}"
        # Audiobookshelf keeps its OIDC settings in its own database; the same
        # secret is typed there by hand.
        AUDIOBOOKSHELF_OIDC_CLIENT_SECRET: "{{ .audiobookshelf_oidc_client_secret }}"
        # The same field Hermes' own ExternalSecret reads (HERMES_DASHBOARD_OIDC_CLIENT_SECRET).
        HERMES_OIDC_CLIENT_SECRET: "{{ .hermes_OIDC_CLIENT_SECRET }}"
        # App password of the service account syncthing-join (blueprints/forward-auth.yaml).
        SYNCTHING_JOIN_TOKEN: "{{ .syncthing_join_token }}"
  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: Paperless
      rewrite:
        - regexp:
            source: "(.*)"
            target: "paperless_$1"
    - extract:
        key: browser-sessions
      rewrite:
        # Same rewrite as browser-sessions' ExternalSecret, so both read the
        # field under the same name.
        - regexp:
            source: "[^a-zA-Z0-9]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "browser_sessions_$1"
    - extract:
        key: LiteLLM
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: openwebui
      rewrite:
        - regexp:
            source: "(.*)"
            target: "openwebui_$1"
    - extract:
        key: grafana
      rewrite:
        - regexp:
            source: "(.*)"
            target: "grafana_$1"
    - extract:
        key: audiobookshelf
      rewrite:
        - regexp:
            source: "(.*)"
            target: "audiobookshelf_$1"
    - extract:
        key: syncthing
      rewrite:
        - regexp:
            source: "(.*)"
            target: "syncthing_$1"
    - extract:
        key: hermes
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hermes_$1"
