---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openwebui-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .SECRET_KEY }}"
        # OIDC (client ID is the literal "openwebui" in the HelmRelease; only
        # the secret is here, matching the Authentik provider in
        # authentik/app/blueprints/oidc.yaml)
        OAUTH_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OPENID_PROVIDER_URL: https://sso.${SECRET_DOMAIN}/application/o/${APP}/.well-known/openid-configuration
        OPENID_REDIRECT_URI: https://ai.${SECRET_DOMAIN}/oauth/oidc/callback
        # LiteLLM virtual key (dashboard -> Virtual Keys -> Create, name
        # "openwebui"; see docs/ai.md). Used both for the OpenAI-compatible
        # models connection and as the bearer token for the MCP tool server.
        OPENAI_API_KEYS: "{{ .LITELLM_API_KEY }}"
        TOOL_SERVER_CONNECTIONS: >-
          [{"type":"mcp","url":"http://litellm.ai.svc.cluster.local:4000/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"bearer","key":"{{ .LITELLM_API_KEY }}","config":{"enable":true},"info":{"id":"litellm","name":"LiteLLM","description":"LiteLLM MCP gateway - every MCP server the openwebui key is scoped to."}}]
        # Postgres
        INIT_POSTGRES_DBNAME: openwebui
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        DATABASE_URL: postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres16-rw.database.svc.cluster.local:5432/openwebui
        # Redis
        ENABLE_WEBSOCKET_SUPPORT: "true"
        WEBSOCKET_MANAGER: "redis"
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/7"
        WEBSOCKET_REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/7"
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: openwebui
        property: SECRET_KEY
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: openwebui
        property: OIDC_CLIENT_SECRET
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: openwebui
        property: LITELLM_API_KEY
    - secretKey: POSTGRES_USER
      remoteRef:
        key: openwebui
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: openwebui
        property: POSTGRES_PASS
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: cloudnative-pg
        property: POSTGRES_SUPER_PASS
