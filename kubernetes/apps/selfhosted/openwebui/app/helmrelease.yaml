---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
spec:
  chartRef:
    kind: OCIRepository
    name: openwebui
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
    controllers:
      openwebui:
        annotations:
          secret.reloader.stakater.com/reload: &secret openwebui-secret
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: *secret
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
            env:
              TZ: ${TIMEZONE}
              WEBUI_URL: https://ai.${SECRET_DOMAIN}
              CORS_ALLOW_ORIGIN: https://ai.${SECRET_DOMAIN}
              # Ollama
              ENABLE_OLLAMA_API: true
              OLLAMA_BASE_URL: http://ai.local.jaimenet.com:11434
              # LiteLLM (ai/litellm): every model behind the gateway, in-cluster.
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URLS: http://litellm.ai.svc.cluster.local:4000/v1
              # Key is OPENAI_API_KEYS in externalsecret.yaml (OPENAI_API_CONFIGS
              # keys connections by index into this list, so keep it single-valued).
              ENABLE_SIGNUP: false
              ENABLE_INITIAL_ADMIN_SIGNUP: true
              ENABLE_LOGIN_FORM: true
              ENABLE_PERSISTENT_CONFIG: false
              WEBUI_SESSION_COOKIE_SAME_SITE: lax
              WEBUI_SESSION_COOKIE_SECURE: true
              # Searx
              WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng.selfhosted.svc.cluster.local:8080/search?q=<query>
              # Redis
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
              # Tool servers: LiteLLM's MCP gateway (TOOL_SERVER_CONNECTIONS in
              # externalsecret.yaml, embeds the bearer key).
              ENABLE_TOOL_SERVERS: true
              # OIDC (Authentik, provider "openwebui" in
              # authentik/app/blueprints/oidc.yaml). Secret and endpoints are in
              # externalsecret.yaml.
              ENABLE_OAUTH_SIGNUP: true
              # false: merging into an existing account by email alone lets
              # anyone who controls a matching, "verified" email take it over.
              # Local signup is already off, so nothing legitimate needs it.
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: false
              OAUTH_PROVIDER_NAME: Authentik
              OAUTH_CLIENT_ID: openwebui
              OAUTH_SCOPES: "openid email profile"
              DEFAULT_USER_ROLE: "user"
            envFrom:
              - secretRef:
                  name: *secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: false
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 2Gi
    service:
      app:
        controller: openwebui
        ports:
          http:
            port: 8080
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          openwebui:
            app:
              - path: /tmp
                subPath: tmp
      config:
        enabled: true
        existingClaim: openwebui-data
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: OpenWebUI
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: si-openaigym.svg
          gethomepage.dev/name: OpenWebUI
          gethomepage.dev/app: openwebui
        hostnames:
          - "ai.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

