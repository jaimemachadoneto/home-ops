---
# Settings of the notes MCP server (the obsidian-mcp container). db_password is
# the same field as the CNPG role in
# kubernetes/apps/database/cloudnative-pg/cluster/obsidian-mcp.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: obsidian-mcp-secret
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        DATABASE_URL: "postgresql+asyncpg://obsidian_mcp:{{ .db_password }}@postgres16-rw.database.svc.cluster.local:5432/obsidian_mcp"
  data:
    - secretKey: secret_key
      remoteRef:
        key: obsidian-mcp
        property: secret_key
    - secretKey: db_password
      remoteRef:
        key: obsidian-mcp
        property: db_password
