---
# Settings of the notes MCP server (the obsidian-mcp container). The database
# is the cluster obsidian-mcp-postgres (components/cnpg). Its owner Secret
# reads the same db_password field.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: obsidian-mcp-secret
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        DATABASE_URL: "postgresql+asyncpg://obsidian_mcp:{{ .db_password }}@obsidian-mcp-postgres-rw.selfhosted.svc.cluster.local:5432/obsidian_mcp"
  data:
    - secretKey: secret_key
      remoteRef:
        key: obsidian-mcp
        property: secret_key
    - secretKey: db_password
      remoteRef:
        key: obsidian-mcp
        property: db_password
---
# Syncthing's REST API key. Without it, Syncthing makes a random key that no
# script knows. syncthing-join in nix-config reads the same field.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: syncthing-secret
    creationPolicy: Owner
  data:
    - secretKey: STGUIAPIKEY
      remoteRef:
        key: syncthing
        property: api_key
