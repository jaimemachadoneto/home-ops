---
# The web UI has no password of its own: Authentik on envoy-internal is the
# only gate. Without this policy, any pod could call the Service directly,
# skip Authentik, and share the vault with a device of its own.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing
      app.kubernetes.io/instance: syncthing
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
    # The kubelet probes come from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # The notes MCP server. Only the LiteLLM MCP gateway may call it, and only
    # /mcp: the panel and the API on the same port have no login of their own
    # in single-user mode, and they can create API keys.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              # The methods of the MCP streamable HTTP transport.
              - method: GET|POST|DELETE
                path: /mcp(/.*)?
    # Devices connect through the LoadBalancer, from the LAN or a relay.
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "22000"
              protocol: TCP
            - port: "22000"
              protocol: UDP
