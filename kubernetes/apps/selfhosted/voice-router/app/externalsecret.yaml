---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voice-router
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: voice-router-secret
    template:
      data:
        # What Home Assistant and the dashboard present. It opens the log and
        # the proposal decisions, so it does not leave the house network.
        VOICE_ROUTER_TOKEN: "{{ .voice_router_token }}"
        # A LiteLLM virtual key, limited to the model `jev`. It is not the
        # router token and it grants no access to the router.
        VOICE_ROUTER_JEV_KEY: "{{ .voice_router_jev_key }}"
  dataFrom:
    - extract:
        key: voice-router
      rewrite:
        # The 1Password fields are `token` and `jev_key`. Every character that
        # is not alphanumeric becomes an underscore, so a field named `jev key`
        # or `jev-key` arrives as the same key.
        - regexp:
            source: "[^a-zA-Z0-9]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "voice_router_$1"