---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browser-sessions
spec:
  chartRef:
    kind: OCIRepository
    name: browser-sessions
  interval: 30m
  values:
    controllers:
      browser-sessions:
        annotations:
          reloader.stakater.com/auto: "true"

        # One replica, Recreate: each session is one Chromium on one profile
        # directory, and two Chromiums on the same profile corrupt it.
        replicas: 1
        strategy: Recreate

        pod:
          # The app never talks to the Kubernetes API.
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            # pwuser in the Playwright image: 1001, not 1000. 1000 is `ubuntu`,
            # whose home is on the read-only root, and Chromium aborts at start
            # (crashpad: "--database is required") without a writable home.
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/jaimemachadoneto/browser-sessions
              # Immutable: CI publishes sha-<short commit> for every push to main.
              tag: sha-12dc00e
            env:
              BWS_PORT: &httpPort 8080
              # OIDC redirects, the admin UI's Origin check and the MCP URLs
              # shown in the UI are all built from this.
              BWS_PUBLIC_URL: https://bwsessions.${SECRET_DOMAIN}
              # Authentik's issuer for the provider in its blueprints/oidc.yaml.
              BWS_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/browser-sessions/
              BWS_OIDC_CLIENT_ID: browser-sessions
              # What the browser reports to the sites. Match your own.
              BWS_TIMEZONE: Europe/Madrid
              BWS_LOCALE: es-ES
            envFrom:
              - secretRef:
                  name: browser-sessions-secret
            probes:
              # /healthz answers from the process alone; a session whose browser
              # is down shows in the admin UI, it does not restart the pod.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Mostly Chromium, one per session. The admin UI graphs each
                # session's memory; adjust from what it shows.
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      app:
        ports:
          http:
            port: *httpPort

    persistence:
      # state.db (sessions, hashed tokens, approvals) and the browser profiles,
      # which hold the sites' sign-in cookies. Volsync's backups of it are
      # encrypted, but treat its repository like a password store.
      data:
        existingClaim: browser-sessions-data
        globalMounts:
          - path: /data
      # readOnlyRootFilesystem leaves nowhere else to write: Chromium, Xvfb and
      # x11vnc need /tmp, and Chromium a writable home (pwuser's, from
      # /etc/passwd).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      home:
        type: emptyDir
        globalMounts:
          - path: /home/pwuser
      # Chromium needs more shared memory than the container's 64Mi default.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Logged-in browsers for AI agents
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: mdi-web-box
          gethomepage.dev/name: Browser Sessions
          gethomepage.dev/href: https://bwsessions.${SECRET_DOMAIN}/admin
        # Internal only. Paperclip (VLAN 70) reaches /<session>/mcp through
        # this gateway too, with a bearer token per session; the admin UI at
        # /admin signs in with Authentik.
        hostnames:
          - bwsessions.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
