---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-sessions
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: browser-sessions-secret
    template:
      data:
        # Signs the admin cookies. Rotating it signs every admin out.
        BWS_SECRET_KEY: '{{ .browser_sessions_secret_key }}'
        # The same field Authentik's blueprint reads for this client.
        BWS_OIDC_CLIENT_SECRET: '{{ .browser_sessions_oidc_client_secret }}'
        # Comma-separated. Kept here, not in git: they are personal addresses.
        BWS_ADMIN_EMAILS: '{{ .browser_sessions_admin_emails }}'
  dataFrom:
    - extract:
        key: browser-sessions
      rewrite:
        # As in bank-report: any non-alphanumeric character becomes an
        # underscore, so `secret key` and `secret-key` both arrive as
        # secret_key. Case is not folded: name the fields in lower case.
        - regexp:
            source: '[^a-zA-Z0-9]'
            target: '_'
        - regexp:
            source: '(.*)'
            target: 'browser_sessions_$1'
