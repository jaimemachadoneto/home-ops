---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ai
spec:
  chartRef:
    kind: OCIRepository
    name: paperless-ai
  interval: 30m
  values:
    controllers:
      paperless-ai:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: docker.io/clusterzx/paperless-ai
              tag: 3.0.9@sha256:2b65888163fd59716f1c8285b31c5bd0b30c9c3c192c42b516688e3887d4ba60
            env: &env
              TZ: ${TIMEZONE}
              PAPERLESS_API_URL: http://paperless.selfhosted.svc.cluster.local:8000/api
              # Process every new document, not only documents with a tag. The
              # database of paperless-ai keeps each document to one run.
              PROCESS_PREDEFINED_DOCUMENTS: "no"
              # Set topic tags. With tagging on, paperless-ai adds no
              # "ai-processed" tag; see its history page for what it did.
              ACTIVATE_TAGGING: "yes"
              # The model through LiteLLM (ai/litellm), with its own virtual key
              # (CUSTOM_API_KEY in externalsecret.yaml). These win over the
              # settings that the web UI writes in data/.env, at runtime. The
              # startup check reads data/.env only, so the init container
              # sync-env copies them there.
              AI_PROVIDER: custom
              CUSTOM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              # deepseek-v4.1-flash with reasoning off (a LiteLLM model entry). In a
              # test on the Paperless documents it found the correspondents that
              # gemini-2.5-flash-lite missed, at about 60% of its cost.
              CUSTOM_MODEL: deepseek-v4.1-flash-noreason
              # The full request (prompt, tag list, answer and document text).
              # paperless-ai cuts the end of a longer document. About 35 pages
              # of text; at most about $0.002 a document.
              TOKEN_LIMIT: "40000"
            envFrom: &envFrom
              - secretRef:
                  name: paperless-ai-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
        initContainers:
          # Write the Paperless user and the provider settings of git (and of
          # externalsecret.yaml) into data/.env, so the startup
          # check and the web UI show the same values as the runtime. The rest
          # of data/.env (prompt, tags, API keys of the UI) stays as it is.
          sync-env:
            image: *image
            env: *env
            envFrom: *envFrom
            command: ["sh", "-c"]
            args:
              - |
                set -eu
                f=/app/data/.env
                # Before the first setup in the web UI there is no file to sync.
                [ -f "$f" ] || exit 0
                for k in PAPERLESS_API_TOKEN PAPERLESS_USERNAME PROCESS_PREDEFINED_DOCUMENTS ACTIVATE_TAGGING AI_PROVIDER CUSTOM_BASE_URL CUSTOM_MODEL CUSTOM_API_KEY TOKEN_LIMIT; do
                  awk -v k="$k" 'BEGIN { v = ENVIRON[k]; done = 0 }
                    index($0, k "=") == 1 { print k "=" v; done = 1; next }
                    { print }
                    END { if (!done) print k "=" v }' "$f" > "$f.tmp"
                  mv "$f.tmp" "$f"
                done
                grep -E '^(PAPERLESS_USERNAME|PROCESS_PREDEFINED_DOCUMENTS|ACTIVATE_TAGGING|AI_PROVIDER|CUSTOM_MODEL|TOKEN_LIMIT)=' "$f"
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: paperless-ai
        ports:
          http:
            port: 3000

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Paperless AI
          gethomepage.dev/group: Documents
          gethomepage.dev/icon: si-paperlessngx.svg
          gethomepage.dev/name: PaperlessAI
          gethomepage.dev/app: paperless-ai
        hostnames:
          - "paperless-ai.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: paperless-ai
                port: 3000
                namespace: selfhosted

    persistence:
      config:
        existingClaim: paperless-ai-data
        globalMounts:
          - path: /app/data
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/public/images
      home:
        type: emptyDir
        globalMounts:
          - path: /home/node/.pm2
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
