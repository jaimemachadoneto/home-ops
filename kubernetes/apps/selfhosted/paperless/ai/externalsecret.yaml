---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-ai-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Its own Paperless user (group ai-services: view and change documents,
        # no delete, no admin), not the superuser.
        PAPERLESS_API_TOKEN: "{{ .paperless_ai_api_token }}"
        PAPERLESS_USERNAME: paperless-ai
        # LiteLLM virtual key (dashboard -> Virtual Keys -> Create, name
        # "paperless-ai", only the model of CUSTOM_MODEL, no MCP servers;
        # see docs/ai.md).
        CUSTOM_API_KEY: "{{ .PAPERLESS_AI_LITELLM_API_KEY }}"
  dataFrom:
    - extract:
        key: Paperless
