---
# paperless-ai creates tags, correspondents and document types as its own
# user, and Paperless makes that user the owner. Nobody else can then see
# them: the agents (paperless-mcp) and paperless-gpt get "Private" or an
# unknown ID. Paperless has no setting for unowned objects, and paperless-ai
# sets no owner. So this job removes the owner from each object that
# paperless-ai owns; an object with no owner is visible to every user with
# view permission. The owner can change the owner of its own objects, so the
# job needs only the token of paperless-ai and the change permission of the
# group ai-services on these objects (docs/paperless-mcp.md).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-ai-share-objects
spec:
  # paperless-ai scans at :00, :10, ...; run five minutes after each scan.
  schedule: "5-59/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: app
              image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              env:
                - name: PAPERLESS_API
                  value: http://paperless.selfhosted.svc.cluster.local:8000/api
                - name: PAPERLESS_USERNAME
                  value: paperless-ai
                - name: PAPERLESS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: paperless-ai-secret
                      key: PAPERLESS_API_TOKEN
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  auth="Authorization: Token ${PAPERLESS_API_TOKEN}"
                  me=$(curl -fsS -H "$auth" "${PAPERLESS_API}/users/?username__iexact=${PAPERLESS_USERNAME}" | jq -e '.results[0].id')
                  for kind in tags correspondents document_types; do
                    ids=$(curl -fsS -H "$auth" "${PAPERLESS_API}/${kind}/?page_size=10000" | jq -r --argjson me "$me" '.results[] | select(.owner == $me) | .id')
                    for id in $ids; do
                      curl -fsS -o /dev/null -X PATCH -H "$auth" -H "Content-Type: application/json" -d '{"owner": null}' "${PAPERLESS_API}/${kind}/${id}/"
                      echo "${kind} ${id}: owner removed"
                    done
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
