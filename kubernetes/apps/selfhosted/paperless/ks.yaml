---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname paperless
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
    - ../../../../components/keda/nas-nfs-scaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/selfhosted/paperless/app
  prune: true
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: paperless-data
      VOLSYNC_CAPACITY: 15Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname paperless-ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
  interval: 10m
  path: ./kubernetes/apps/selfhosted/paperless/ai
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: paperless-ai-data
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname paperless-gpt
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
  interval: 10m
  path: ./kubernetes/apps/selfhosted/paperless/gpt
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: paperless-gpt-data
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
---
# The Paperless MCP server (docs/paperless-mcp.md). It has no volume: its
# search index is in the database paperless_mcp of the Postgres cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname paperless-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  # The database moves from postgres16 to its own cluster. The import
  # component copies it at the first start. TODO: remove the import component
  # after the first backup of paperless-mcp-postgres.
  components:
    - ../../../../components/cnpg/pg18
    - ../../../../components/cnpg/import
  # The server exits at start when Postgres is not ready.
  dependsOn:
    - name: cloudnative-pg-barman-cloud
      namespace: database
    - name: cloudnative-pg-cluster
      namespace: database
  interval: 10m
  path: ./kubernetes/apps/selfhosted/paperless/mcp
  postBuild:
    substitute:
      APP: *appname
      CNPG_DATABASE: paperless_mcp
      CNPG_OWNER: paperless_mcp
      CNPG_PASSWORD_ITEM: Paperless
      CNPG_PASSWORD_PROPERTY: paperless_mcp_db_password
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
