---
# The Paperless MCP server (docs/paperless-mcp.md). Agents reach /mcp only
# through the LiteLLM MCP gateway (ai/paperless-mcp). Each MCP request brings
# the token of the Paperless user paperless-mcp, so the permissions of that user
# (group mcp-read, view only) are the limit. With the image of the fork
# (docs/paperless-mcp.md, "Deploy of phase 3"), the upload links are the
# exception. /upload/<token> is public and sends the file as the user
# paperless-upload. This user can only add documents, and view tags,
# correspondents, document types and tasks.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: paperless-mcp
  interval: 30m
  values:
    controllers:
      paperless-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/baruchiro/paperless-mcp
              tag: 2.2.1@sha256:7a793eeeb2ef9ea43175bf6b43b2179cc7c5b7e5484b6aecea8984a61d1ffe2d
            # The image starts HTTP mode itself: node build/index.js --http --port 3000.
            env:
              TZ: ${TIMEZONE}
              PAPERLESS_URL: http://paperless.selfhosted.svc.cluster.local:8000
              # Links in the answers point to the web UI.
              PAPERLESS_PUBLIC_URL: https://paperless.${SECRET_DOMAIN}
              # post_document with file_path could read files of the pod: no
              # directory is allowed.
              PAPERLESS_MCP_UPLOAD_PATHS: /nonexistent
              PAPERLESS_UPLOAD_PUBLIC_URL: https://paperless-upload.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: paperless-mcp-upload-secret
            probes:
              liveness: &probe
                enabled: true
                type: TCP
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        # The image sets no user; node:24-slim has the user node (1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    route:
      upload:
        # Only the single-use upload links are public: /mcp stays behind LiteLLM.
        # The link is the only check (docs/paperless-mcp.md, phase 3).
        hostnames:
          - paperless-upload.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /upload/
            backendRefs:
              - identifier: app
                port: 3000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
