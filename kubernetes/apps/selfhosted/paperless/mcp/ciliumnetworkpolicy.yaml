---
# The MCP server has no login of its own: the Paperless token in each request
# is its only check. Only the LiteLLM MCP gateway can call /mcp. Only
# envoy-external can call /upload/ and /download/, where the single-use link
# is the check. The server can call only Paperless, the Postgres pods
# (`postgres16`), Ollama (and DNS).
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              # The methods of the MCP streamable HTTP transport.
              - method: GET|POST|DELETE
                path: /mcp(/.*)?
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              # GET gives the form, POST takes the file.
              - method: GET|POST
                path: /upload/[A-Za-z0-9_-]+
              # A download link gives the file once.
              - method: GET
                path: /download/[A-Za-z0-9_-]+
    # The kubelet probes come from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Prometheus scrapes the metrics of the server (/metrics). The endpoint has
    # no token of its own: this rule and the port of the Service are the gate.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # Replies of Paperless to the calls of the server. When both pods run on
    # the same node, Cilium checked the SYN-ACK of the Service connection
    # against these ingress rules and dropped it ("Policy denied"), so every
    # call timed out. Paperless itself never opens a connection to the server.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: paperless
            app.kubernetes.io/controller: paperless
    # Replies from Postgres to the server. When the primary runs on the same
    # node, Cilium (socketLB.hostNamespaceOnly) drops its SYN-ACK as a new
    # ingress flow, and the connection times out. No toPorts: the reply goes
    # to an ephemeral port.
    # shortcut: Postgres pods may also open connections to this pod; remove
    # this rule once Cilium tracks same-node Service replies again.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: paperless
            app.kubernetes.io/controller: paperless
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Text Embeddings Inference on the AI host, for the embeddings. The host
    # ai.local.<domain> is the LXC 10.30.50.13. EMBEDDING_URL in
    # helmrelease.yaml names the host and the port: change both together.
    # The port 11434 of Ollama comes back with EMBEDDING_PROVIDER=ollama.
    - toCIDR:
        - 10.30.50.13/32
      toPorts:
        - ports:
            - port: "11435"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
