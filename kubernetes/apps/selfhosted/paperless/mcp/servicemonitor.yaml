---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless-mcp
  labels:
    app.kubernetes.io/instance: paperless-mcp
    app.kubernetes.io/name: paperless-mcp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: paperless-mcp
      app.kubernetes.io/name: paperless-mcp
  namespaceSelector:
    matchNames:
      - selfhosted
  targetLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/name
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s