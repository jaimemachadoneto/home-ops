---
# The Paperless API token of the user paperless-upload. This user can only add
# documents, and view tags, correspondents, document types and tasks
# (docs/paperless-mcp.md, phase 3). An upload through a link brings no token,
# so the server keeps this one. The token is in the 1Password item Paperless,
# field paperless_upload_api_token.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-mcp-upload-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_UPLOAD_API_KEY
      remoteRef:
        key: Paperless
        property: paperless_upload_api_token
