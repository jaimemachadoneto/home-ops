---
# The Paperless API token of the user paperless-upload. This user can only add
# documents, and view tags, correspondents, document types and tasks
# (docs/paperless-mcp.md, phase 3). An upload through a link brings no token,
# so the server keeps this one. The token is in the 1Password item Paperless,
# field paperless_upload_api_token.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-mcp-upload-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_UPLOAD_API_KEY
      remoteRef:
        key: Paperless
        property: paperless_upload_api_token
---
# The search index: the token of the Paperless user paperless-mcp, for the sync
# of the documents, and the password of the database paperless_mcp (a Secret of
# the namespace database holds the same password). Both are in the 1Password
# item Paperless. DATABASE_URL is a template because the password is only one
# part of it.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-mcp-search-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_SYNC_API_KEY: "{{ .api_token }}"
        DATABASE_URL: "postgres://paperless_mcp:{{ .db_password }}@postgres16-rw.database.svc.cluster.local:5432/paperless_mcp"
  data:
    - secretKey: api_token
      remoteRef:
        key: Paperless
        property: paperless_mcp_api_token
    - secretKey: db_password
      remoteRef:
        key: Paperless
        property: paperless_mcp_db_password
