---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-gpt
spec:
  chartRef:
    kind: OCIRepository
    name: paperless-ai
  interval: 30m
  values:
    controllers:
      paperless-gpt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/icereed/paperless-gpt
              tag: v0.31.0@sha256:d668941a829552cc0eddbc7c22506b3480dfbf61bd0d6eae881ad9fcfe2de70c
            env:
              TZ: Europe/Madrid
              PAPERLESS_BASE_URL: http://paperless.selfhosted.svc.cluster.local:8000
              PAPERLESS_PUBLIC_URL: https://paperless.${SECRET_DOMAIN}
              # OCR only: paperless-ai does titles, tags and correspondents (tag
              # "process"). Tag a bad scan "ai-ocr" to read it again.
              # Models through LiteLLM (ai/litellm), key OPENAI_API_KEY in
              # externalsecret.yaml. LLM_* is required, but OCR uses VISION_LLM_*.
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              LLM_PROVIDER: openai
              LLM_MODEL: openrouter/google/gemini-2.5-flash-lite
              LLM_LANGUAGE: Spanish
              OCR_PROVIDER: llm
              VISION_LLM_PROVIDER: openai
              # flash-lite: no reasoning tokens. gemini-3.5-flash used ~3300 per page
              # (about $0.03 a page) to copy text.
              VISION_LLM_MODEL: openrouter/google/gemini-2.5-flash-lite
              # No page limit: the new version must have every page.
              OCR_LIMIT_PAGES: 0
              OCR_PROCESS_MODE: image
              # The default is 600 DPI: a 600 DPI scan rendered as 4959x7009
              # pages and the container hit its memory limit (OOMKilled).
              # 200 DPI is enough for the vision model.
              IMAGE_MAX_RENDER_DPI: 200
              # Keep the text of pages that are already digital (less cost).
              OCR_SKIP_DIGITAL_PAGES: true
              PDF_SKIP_EXISTING_OCR: false
              # No PDF upload: an LLM is not an hOCR provider, so paperless-gpt
              # writes the text in the content of the document, and the original
              # file stays. A PDF upload also turned off OCR_SKIP_DIGITAL_PAGES.
              PDF_OCR_TAGGING: true
              PDF_OCR_COMPLETE_TAG: ai-ocr-done
              AUTO_OCR_TAG: ai-ocr
              # Not used: metadata comes from paperless-ai.
              AUTO_GENERATE_TITLE: false
              AUTO_GENERATE_TAGS: false
              AUTO_GENERATE_CORRESPONDENTS: false
              AUTO_GENERATE_CREATED_DATE: false
              AUTO_TAG: ai-auto
              # Not "process": that tag starts paperless-ai.
              MANUAL_TAG: gpt-review
            envFrom:
              - secretRef:
                  name: paperless-gpt-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                # OCR renders every page of a document to an image in memory.
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Documents
          gethomepage.dev/name: Paperless GPT
          gethomepage.dev/icon: paperless.png
          gethomepage.dev/description: AI Setup for Paperless
          gethomepage.dev/siteMonitor: http://paperless-gpt.selfhosted.svc.cluster.local:8080
        hostnames:
          - paperless-gpt.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      data:
        existingClaim: paperless-gpt-data
        advancedMounts:
          paperless-gpt:
            app:
              - path: /app/db
                subPath: db
              - path: /app/prompts
                subPath: prompts
              - path: /app/config
                subPath: config
      tmpfs:
        type: emptyDir
        advancedMounts:
          paperless-gpt:
            app:
              - path: /tmp
                subPath: tmp
