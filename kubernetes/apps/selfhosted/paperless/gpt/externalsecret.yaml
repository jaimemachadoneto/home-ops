---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-gpt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Its own Paperless user (group ai-services: view and change documents,
        # no delete, no admin), not the superuser.
        PAPERLESS_API_TOKEN: "{{ .paperless_gpt_api_token }}"
        PAPERLESS_USERNAME: paperless-gpt
        # The LiteLLM virtual key of paperless-ai (gemini-2.5-flash-lite and others).
        OPENAI_API_KEY: "{{ .PAPERLESS_AI_LITELLM_API_KEY }}"
  data:
    - secretKey: paperless_gpt_api_token
      remoteRef:
        key: Paperless
        property: paperless_gpt_api_token
    - secretKey: PAPERLESS_AI_LITELLM_API_KEY
      remoteRef:
        key: Paperless
        property: PAPERLESS_AI_LITELLM_API_KEY

