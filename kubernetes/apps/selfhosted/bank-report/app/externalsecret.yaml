---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-report
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bank-report-secret
    template:
      data:
        # From `pnpm hash-password`, which prints both. The plaintext password
        # never leaves your machine.
        APP_PASSWORD_HASH: '{{ .bank_report_app_password_hash }}'
        # Rotating this logs everyone out, which is how a session is revoked.
        SESSION_SECRET: '{{ .bank_report_session_secret }}'
        # The Actual server login. The only third-party credential this app holds.
        ACTUAL_PASSWORD: '{{ .bank_report_actual_password }}'
        # Which budget to sync. Not strictly a credential, but it names a
        # specific budget and keeping it here means one item to fill in.
        ACTUAL_SYNC_ID: '{{ .bank_report_actual_sync_id }}'
  dataFrom:
    - extract:
        key: bank-report
      rewrite:
        # Every character that is not alphanumeric becomes an underscore, so a
        # 1Password field named `app password hash`, `app-password-hash` or
        # `app_password_hash` all arrive as the same key.
        #
        # The space and hyphen used to be inside this set, which meant they
        # survived — and a field named as the docs said to name it produced
        # `bank_report_app password hash`, which no template below asks for. The
        # first install failed on exactly that.
        #
        # Case is *not* folded: name the fields in lower case.
        - regexp:
            source: '[^a-zA-Z0-9]'
            target: '_'
        - regexp:
            source: '(.*)'
            target: 'bank_report_$1'
