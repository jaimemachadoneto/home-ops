---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  docker.yaml: ""

  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: true
    traefik: false

  settings.yaml: |
    title: Homelab
    # background:
    #   image: https://raw.githubusercontent.com/joryirving/home-ops/main/.docs/assets/101518784_p0.jpg
    #   opacity: 20
    favicon: https://github.com/walkxcode/dashboard-icons/blob/main/png/heimdall.png
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: false
    fiveColumns: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
    layout:
      style: column
      # Daily use first, cluster admin second, the long Downloads list last.
      Daily:
        style: row
        header: false
        columns: 4
        Home Automation:
          style: column
          icon: home-assistant
        AI:
          style: column
          icon: mdi-robot
        Apps:
          style: column
          icon: mdi-apps
        Media:
          style: column
          icon: jellyfin
      Admin:
        style: row
        header: false
        columns: 4
        Infrastructure:
          style: column
          icon: proxmox
        Monitoring:
          style: column
          icon: grafana
        Network:
          style: column
          icon: wireguard
        Tools:
          style: column
          icon: it-tools
      Library:
        style: column
        header: false
        Downloads:
          style: row
          columns: 6
          icon: sonarr

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
    - search:
        provider: duckduckgo
        focus: false
        target: _blank

  bookmarks.yaml: ""

  # Only for entries that no route can carry: the LiteLLM operator's HTTPRoute
  # has no annotations field, and a widget with a list of metrics does not fit
  # in an annotation.
  services.yaml: |
    - Monitoring:
        - Cluster Health:
            icon: mdi-heart-pulse
            description: Problems that need a look (0 is good)
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Alerts firing
                  query: count(ALERTS{alertstate="firing",severity!="none"}) or vector(0)
                - label: Nodes not ready
                  query: count(kube_node_status_condition{condition="Ready",status="true"} == 0) or vector(0)
                - label: Pods failing
                  query: count(kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"}) or vector(0)
                - label: Targets down
                  query: count(up == 0) or vector(0)
    - AI:
        - LiteLLM:
            href: https://litellm.${SECRET_DOMAIN}/ui
            icon: sh-litellm.png
            description: Model gateway and MCP servers (one URL)
            siteMonitor: http://litellm.ai.svc.cluster.local:4000/health/liveliness
