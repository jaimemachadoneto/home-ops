---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperclip-sandbox-tenant
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: paperclip-sandbox-tenant
  dependsOn:
    - name: agent-sandbox
      namespace: agent-sandbox-system
  interval: 1h
  path: "./kubernetes/apps/paperclip-casa/sandbox-tenant/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: paperclip-casa
  timeout: 5m
  wait: false
