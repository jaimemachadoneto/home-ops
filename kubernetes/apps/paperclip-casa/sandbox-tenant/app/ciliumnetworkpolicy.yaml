---
# Agent pods read external data only through LiteLLM, where the
# prompt-injection check runs. They can reach only DNS, the LiteLLM pods, the
# model API of the agent (OpenRouter) and the Paperclip server on the VM.
# The plugin skips its own policies because these names exist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip-egress-fqdn
spec:
  endpointSelector:
    matchLabels:
      paperclip.io/role: agent
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # LiteLLM inside the cluster (http://litellm.ai.svc.cluster.local:4000).
    # litellm.jaimenet.com resolves to the envoy-internal gateway, which also
    # serves every other internal app, so the gateway stays closed.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toFQDNs:
        - matchName: openrouter.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The Paperclip server (paperclip.jaimenet.com) on the VM.
    - toCIDR:
        - 10.30.70.5/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
