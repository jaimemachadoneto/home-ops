---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: agent-sandbox
  interval: 1h
  path: "./kubernetes/apps/agent-sandbox-system/agent-sandbox/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agent-sandbox-system
  timeout: 5m
  wait: true
