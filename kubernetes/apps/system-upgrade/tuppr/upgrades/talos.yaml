---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.12
  policy:
    rebootMode: default
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      # Ceph 20.2.4 (rook-ceph-cluster 1.21.1, #223) added HEALTH_ERR checks
      # for the cluster's cephx key type (aes), which the chart picks because
      # our node kernels (6.18) are below the 7.0 threshold for a stronger
      # cipher. Expected, not a fault - see rook-ceph/rook-ceph/ks.yaml for
      # the matching Flux health-gate change (#385). Tolerate HEALTH_ERR here
      # too, so a Talos upgrade (#218) isn't blocked by it.
      # TODO: revisit once a real fix removes the AUTH_INSECURE_* checks.
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN', 'HEALTH_ERR']
