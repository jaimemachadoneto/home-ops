---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # v1.37.1 is not reachable yet: talosctl refuses "unsupported upgrade
    # path 1.36->1.37" because Talos v1.13.12's own bundled Kubernetes is
    # v1.36.3 (see its release notes) - Talos 1.13.x does not support
    # Kubernetes 1.37.x at all. Revisit once a Talos release that does is
    # available; a new Renovate PR offering 1.37.x again should be closed
    # with that reason until then.
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      # Same as talos.yaml / rook-ceph/rook-ceph/ks.yaml (#385, #386): Ceph
      # 20.2.4 added HEALTH_ERR checks for the cluster's aes cephx key type,
      # expected given our kernels (6.18) are below the 7.0 cipher threshold.
      # Tolerate it here too, so a Kubernetes upgrade (#224) isn't blocked.
      # TODO: revisit once a real fix removes the AUTH_INSECURE_* checks.
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN', 'HEALTH_ERR']
