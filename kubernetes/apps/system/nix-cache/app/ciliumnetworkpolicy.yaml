---
# Only the sandboxes of Hermes call the Nix cache. The policy has no egress
# rule, so the cache reaches the upstream caches and the NAS as before.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nix-cache
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-sandbox
      toPorts:
        - ports:
            - port: "8501"
              protocol: TCP
