---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 30m
  values:
    service:
      registry: {}
    serviceMonitor:
      enabled: true
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      containerdSock: /run/containerd/containerd.sock
      # Exclude registries spegel has no business mirroring: a Talos installer
      # image is pulled once per node per upgrade, never shared across pods,
      # so P2P mirroring only adds a cache-miss hang with no real upstream
      # fallback once spegel claims (but fails to serve) the pull.
      registryFilters:
        - "^factory\\.talos\\.dev/"
