---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 30m
  values:
    service:
      registry: {}
    serviceMonitor:
      enabled: true
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      containerdSock: /run/containerd/containerd.sock
      # registryFilters alone doesn't stop spegel writing a hosts.toml entry
      # for a registry - that's controlled by mirroredRegistries, which
      # defaults to every registry (empty = all). Switched to an explicit
      # allowlist so factory.talos.dev never gets a mirror entry at all: a
      # Talos installer image is pulled once per node per upgrade, never
      # shared across pods, so it's never actually cached, and the pull
      # stalls with no upstream fallback once spegel claims (but fails to
      # serve) it. Keep this list in sync with the registries actually in
      # use (`grep -rhoE '(repository|url):' kubernetes/apps/`).
      mirroredRegistries:
        - https://docker.io
        - https://gcr.io
        - https://ghcr.io
        - https://gsoci.azurecr.io
        - https://mirror.gcr.io
        - https://quay.io
        - https://registry.erwanleboucher.dev
