---
# The VictoriaLogs MCP server (mcp-victorialogs) through the LiteLLM MCP
# gateway. It gives agents LogsQL queries on the logs of the last 7 days
# (observability/victoria-logs), for read only. The logs can hold personal
# data and tokens, and the server has no login of its own. The only gate is
# the MCP permission of the LiteLLM key: give it only to a key that may read
# all logs. `mcp:` in repos.yaml only selects what a client asks for.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: victorialogs-mcp
spec:
  alias: victorialogs
  workload:
    image: ghcr.io/victoriametrics/mcp-victorialogs:v1.10.0@sha256:e4b1f38f708a5c99606395ba2de514eab6730ec67440f929c6e3b6f261945d4b
    port: 8081
    # The server does not need a Kubernetes token.
    automountServiceAccountToken: false
    env:
      - name: VL_INSTANCE_ENTRYPOINT
        value: http://victoria-logs-server.observability.svc.cluster.local:9428
      - name: MCP_SERVER_MODE
        value: http
      - name: MCP_LISTEN_ADDR
        value: ":8081"
    # The image runs as root by default. The server is one static Go binary,
    # so it runs as nobody with a read-only root file system.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
