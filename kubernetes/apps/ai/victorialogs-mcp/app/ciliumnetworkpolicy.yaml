---
# The VictoriaLogs MCP server has no login of its own. Only the LiteLLM MCP
# gateway can call it. The server can call only VictoriaLogs (and DNS).
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victorialogs-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The kubelet probes come from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Replies of VictoriaLogs. Cilium can drop a same-node reply as a new
    # ingress flow (see selfhosted/paperless/mcp/ciliumnetworkpolicy.yaml).
    # No toPorts: the reply goes to an ephemeral port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
