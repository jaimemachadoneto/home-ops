---
# The read-write API key of the notes MCP server. Create it once in the
# server's panel (docs/notes-mcp.md, "Deploy"), then save it in 1Password.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name notes-mcp-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: NOTES_MCP_API_KEY
      remoteRef:
        key: obsidian-mcp
        property: api_key
