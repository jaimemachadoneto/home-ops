---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: memini-mcp
  dependsOn:
    - name: litellm-operator
    - name: memini
  interval: 1h
  path: "./kubernetes/apps/ai/memini-mcp/app"
  postBuild:
    substitute:
      APP: memini-mcp
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
