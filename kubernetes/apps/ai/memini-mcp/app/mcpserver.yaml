---
# memini through the LiteLLM MCP gateway, for clients that cannot reach
# memini directly (claude.ai, the Claude mobile app, Open WebUI).
# The gateway sends no project to memini, so the static headers put every
# call in the personal namespace. Claude Code on the workstation talks to
# memini directly and gets one namespace for each repository.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: memini
spec:
  alias: memini
  url: http://memini.ai.svc.cluster.local:8080/mcp
  transport: http
  authType: bearer_token
  authTokenRef:
    name: memini-secret
    key: MEMINI_API_KEY
  params:
    static_headers:
      X-Memini-Namespace: personal/jaime
      X-Memini-Home: personal/jaime
