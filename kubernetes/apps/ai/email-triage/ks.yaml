---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: email-triage
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: email-triage
  # The cluster email-triage-postgres holds the database (components/cnpg).
  components:
    - ../../../../components/cnpg/pg18
  dependsOn:
    - name: cloudnative-pg-barman-cloud
      namespace: database
  interval: 1h
  path: "./kubernetes/apps/ai/email-triage/app"
  postBuild:
    substitute:
      APP: email-triage
      CNPG_DATABASE: email_triage
      CNPG_OWNER: email_triage
      CNPG_PASSWORD_ITEM: email-triage
      CNPG_PASSWORD_PROPERTY: db_password
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
