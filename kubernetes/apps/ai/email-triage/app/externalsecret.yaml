---
# The API and the sync cronjob share this Secret. db_password is the same
# 1Password field as the CNPG role in
# kubernetes/apps/database/cloudnative-pg/cluster/email-triage.yaml. The Gmail
# app password is read-only: the provider opens the mailbox with readonly=True
# and BODY.PEEK.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-triage
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: email-triage-secret
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://email_triage:{{ .db_password }}@postgres16-rw.database.svc.cluster.local:5432/email_triage"
        LITELLM_URL: "http://litellm.ai.svc.cluster.local:4000/v1/systemone"
        LITELLM_API_KEY: "{{ .litellm_api_key }}"
        IMAP_HOST: "imap.gmail.com"
        IMAP_USER: "{{ .imap_user }}"
        IMAP_PASSWORD: "{{ .imap_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: email-triage
        property: db_password
    - secretKey: litellm_api_key
      remoteRef:
        key: email-triage
        property: litellm_api_key
    - secretKey: imap_user
      remoteRef:
        key: email-triage
        property: imap_user
    - secretKey: imap_password
      remoteRef:
        key: email-triage
        property: imap_password
