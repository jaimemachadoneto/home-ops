---
# The rules name the mail services of one person. The actions name the
# addresses that always keep their mail, and the words that do the same in
# a subject. Both stay out of the image: GHCR serves the package without a
# login. The pod reads the two files from this Secret.
#
# The key names are the file names, because the volume mounts each key as a
# file. The pod gets the paths in RULES_PATH and ACTIONS_PATH, in
# helmrelease.yaml. Add the two fields to the 1Password item email-triage:
# rules_csv holds the CSV, actions_toml holds the TOML.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-triage-config
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: email-triage-config
    creationPolicy: Owner
  data:
    - secretKey: rules.csv
      remoteRef:
        key: email-triage
        property: rules_csv
    - secretKey: actions.toml
      remoteRef:
        key: email-triage
        property: actions_toml
