---
# The UniFi Network MCP server through the LiteLLM MCP gateway. It reads the
# UniFi Network controller with an API key only, so it has the read tools
# only. The server has no login of its own: the only gate is the MCP
# permission of the LiteLLM key.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-network-mcp
spec:
  alias: unifi_network
  workload:
    # renovate: datasource=docker depName=ghcr.io/sirkirby/unifi-network-mcp
    image: ghcr.io/sirkirby/unifi-network-mcp:0.53.0@sha256:84c4221880d97d05a989b341a6f733d17f001a0451a049f03587855ff59e5787
    port: 3000
    automountServiceAccountToken: false
    env:
      # The Host header from LiteLLM. The two forms cover a check with and
      # without the port.
      - name: UNIFI_MCP_ALLOWED_HOSTS
        value: unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp.ai.svc.cluster.local:3000
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_PORT
        value: "3000"
      # Keep in sync with the egress rule of the network policy.
      - name: UNIFI_NETWORK_HOST
        value: 10.30.50.1
      # The controller has a self-signed certificate on its IP address.
      - name: UNIFI_NETWORK_VERIFY_SSL
        value: "false"
    envFrom:
      - secretRef:
          name: unifi-network-mcp-secret
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 512Mi
