---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-network-mcp-secret
    creationPolicy: Owner
  data:
    # The API key of unpoller. A key with no username and password gives the
    # read tools only, so agents cannot change the network.
    - secretKey: UNIFI_NETWORK_API_KEY
      remoteRef:
        key: Unifi Controller
        property: unpoller
