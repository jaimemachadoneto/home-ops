---
# Syncs OpenCode Go and OpenRouter model catalogs into LiteLLM's database
# through the admin API so models can be enabled/disabled from the dashboard.
# Source: github.com/jaimemachadoneto/go-catalog-sync.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: go-catalog-sync
spec:
  chartRef:
    kind: OCIRepository
    name: go-catalog-sync
  interval: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

    controllers:
      go-catalog-sync:
        type: cronjob
        cronjob:
          schedule: "0 7 * * *"
          timeZone: Europe/Madrid
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1

        pod:
          restartPolicy: Never

        containers:
          app:
            image:
              # The release workflow of go-catalog-sync sets the tag (sha-<commit>).
              repository: ghcr.io/jaimemachadoneto/go-catalog-sync
              tag: sha-2bea412c287821bf324df7ddc1c399fcab02fd20
            env:
              GO_MODEL_IDS: "kimi-k3.1-pro glm-5.3 qwen3.8-max deepseek-v4-pro gemini-4-argon kimi-k2.7-code minimax-m3 qwen3.7-plus mimo-v2.6-pro glm-5.2 claude-haiku-5-5 gpt-6-luna glm-5.3-flash deepseek-v4.1-flash"
              OPENROUTER_PROVIDERS: "anthropic openai google deepseek qwen x-ai mistralai meta-llama moonshotai minimax z-ai"
              LITELLM_ADMIN_URL: "http://litellm.ai.svc:4000"
              MQTT_HOST: mqtt.jaimenet.com
              MQTT_PORT: "1883"
              MQTT_TOPIC_PREFIX: homelab/opencode-go
              MQTT_OPENROUTER_TOPIC_PREFIX: homelab/openrouter
              OPENCODE_GO_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: opencode-go
                    key: OPENCODE_GO_API_KEY
              LITELLM_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm
                    key: LITELLM_MASTER_KEY
            # MQTT_USER and MQTT_PASS, from the ExternalSecret. Without them
            # the broker refuses the connection and no event reaches Home Assistant.
            envFrom:
              - secretRef:
                  name: go-catalog-sync-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
