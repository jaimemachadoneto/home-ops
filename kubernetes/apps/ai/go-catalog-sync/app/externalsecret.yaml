---
# Deploy key with WRITE access to this repository (GitHub: Settings, Deploy
# keys), and the known_hosts lines of github.com.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-catalog-sync-git
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: go-catalog-sync-git
    creationPolicy: Owner
    template:
      data:
        identity: "{{ .private_key }}"
        known_hosts: "{{ .known_hosts }}"
  dataFrom:
    # 1Password item "go-sync-deploy-key", fields private_key / known_hosts.
    - extract:
        key: go-sync-deploy-key
---
# The MQTT login of ha-status: the same broker and the same Home Assistant.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-catalog-sync-mqtt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: go-catalog-sync-mqtt
    creationPolicy: Owner
    template:
      data:
        MQTT_USER: "{{ .mqtt_username }}"
        MQTT_PASS: "{{ .mqtt_password }}"
  dataFrom:
    # 1Password item "mqtt", fields mqtt_username / mqtt_password.
    - extract:
        key: mqtt
