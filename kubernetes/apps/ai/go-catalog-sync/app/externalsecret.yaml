---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-catalog-sync
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: go-catalog-sync-secret
    creationPolicy: Owner
    template:
      data:
        # Fine-grained token for this repository only: Contents and Pull
        # requests, read and write. The job opens a PR; it does not push to main.
        GITHUB_TOKEN: "{{ .gcs_github_token }}"
        # The MQTT login of ha-status: the same broker and Home Assistant.
        MQTT_USER: "{{ .mqtt_mqtt_username }}"
        MQTT_PASS: "{{ .mqtt_mqtt_password }}"
  dataFrom:
    # 1Password item "go-catalog-sync", field github_token.
    - extract:
        key: go-catalog-sync
      rewrite:
        - regexp:
            source: "(.*)"
            target: "gcs_$1"
    # 1Password item "mqtt", fields mqtt_username / mqtt_password.
    - extract:
        key: mqtt
      rewrite:
        - regexp:
            source: "(.*)"
            target: "mqtt_$1"
