---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-catalog-sync
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: go-catalog-sync-secret
    creationPolicy: Owner
    template:
      data:
        MQTT_USER: "{{ .mqtt_mqtt_username }}"
        MQTT_PASS: "{{ .mqtt_mqtt_password }}"
  dataFrom:
    - extract:
        key: mqtt
      rewrite:
        - regexp:
            source: "(.*)"
            target: "mqtt_$1"