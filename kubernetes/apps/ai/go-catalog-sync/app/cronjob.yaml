---
# Keeps the OpenCode Go fallback of LiteLLM current (see sync.py). It clones
# this repository and reads the go-* targets of the fallbacks in
# litellm/app/litellmproxy.yaml. It writes litellm/app/models/opencode-go.yaml
# with Go's prices and litellm/app/go-catalog.json, and pushes to main. It
# commits only under LITELLM_DIR. Home Assistant gets the device "OpenCode Go
# sync" and the change events over MQTT.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: go-catalog-sync
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: sync
              # Root only for apk at start.
              # TODO: Build a small image with git, ssh and the packages, and run as non-root.
              image: mirror.gcr.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  apk add --no-cache -q git openssh-client &&
                  pip install --no-cache-dir -q --root-user-action=ignore requests==2.32.3 PyYAML==6.0.2 paho-mqtt==2.1.0 &&
                  python /app/sync.py
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: GIT_REPO_URL
                  value: git@github.com:jaimemachadoneto/home-ops.git
                - name: GIT_BRANCH
                  value: main
                - name: LITELLM_DIR
                  value: kubernetes/apps/ai/litellm/app
                - name: MQTT_HOST
                  value: mqtt.jaimenet.com
                - name: MQTT_PORT
                  value: "1883"
                - name: MQTT_TOPIC_PREFIX
                  value: homelab/opencode-go
                - name: OPENCODE_GO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: opencode-go
                      key: OPENCODE_GO_API_KEY
              envFrom:
                - secretRef:
                    name: go-catalog-sync-mqtt
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: git
                  mountPath: /secrets/git
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: go-catalog-sync-script
            - name: git
              secret:
                secretName: go-catalog-sync-git
                defaultMode: 0400
