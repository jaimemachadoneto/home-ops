---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: go-catalog-sync
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: go-catalog-sync
  dependsOn:
    - name: litellm
  interval: 1h
  path: "./kubernetes/apps/ai/go-catalog-sync/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
