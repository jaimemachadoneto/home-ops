---
# The Flux MCP server (flux-operator-mcp) through the LiteLLM MCP gateway. It
# gives agents the state of the Flux resources, the events and the pod logs of
# the cluster, for read only. Keep its version the same as the Flux Operator
# (kubernetes/apps/flux-system/flux-operator).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: flux-mcp
spec:
  alias: flux
  workload:
    image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
    port: 8080
    args:
      - serve
      - --transport=http
      - --port=8080
      # No tool that applies, reconciles, suspends or deletes a resource.
      - --read-only
    serviceAccountName: flux-mcp
    # The Kubernetes client writes its discovery cache in $HOME/.kube. The root
    # file system is read-only, so $HOME is an emptyDir.
    env:
      - name: HOME
        value: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
