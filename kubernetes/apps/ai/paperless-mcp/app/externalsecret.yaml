---
# The Paperless API token of the user paperless-mcp (group mcp-read, view
# only; docs/paperless-mcp.md). 1Password item Paperless, field
# paperless_mcp_api_token.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-mcp-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: PAPERLESS_MCP_API_TOKEN
      remoteRef:
        key: Paperless
        property: paperless_mcp_api_token
