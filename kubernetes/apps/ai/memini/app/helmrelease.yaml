---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 30m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_DISTILL_ON_WRITE: "true"
              # Embeddings from text-embeddings-inference on the AI server
              # (OpenAI-compatible API). The GPU is a GTX 1660 and it embeds
              # about 1800 characters per second, so a long memory of 3500
              # characters takes 2 s, and the repair job sends batches of 8.
              # The write timeout is long for this reason. A recall query is
              # short, so its timeout is short: a slow embedder then costs a
              # keyword search and not a long wait for the agent.
              # The reranker stays in-cluster (llmkube).
              MEMINI_EMBED_BASE_URL: http://ai.local.jaimenet.com:11435/v1
              MEMINI_EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              MEMINI_RECALL_EMBED_TIMEOUT: 5s
              # The width of a store cannot change. This file is the store
              # with 1024 dimensions. The old file memini.db (2560
              # dimensions) stays on the volume as a way back.
              MEMINI_SQLITE_PATH: /data/memini-1024.db
              # Consolidation (contradictions, distillation) through LiteLLM,
              # where all models are managed. memini-llm is a name only: the
              # model behind it is in litellm/app/models/memini-llm.yaml. The
              # budget and the timeout are a safety margin.
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: memini-llm
              MEMINI_LLM_MAX_TOKENS: "8192"
              MEMINI_DISTILL_TIMEOUT: 180s
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_LLM_API_KEY
                    # memini keeps running without consolidation until the
                    # 1Password field exists.
                    optional: true
              MEMINI_RERANK: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080/v1
              MEMINI_RERANK_MODEL: qwen3-reranker
              MEMINI_LOG_FORMAT: json
              MEMINI_RECALL_MIN_SEMANTIC_SCORE: "0.46"
              MEMINI_TOMBSTONE_TTL: 720h
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_SQLITE_PATH: /data/memini-1024.db
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
    persistence:
      data:
        existingClaim: memini
    route:
      internal:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: memini
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/description: Long-term memory for AI agents
          # Homepage takes the path of the first rule (/v1/) otherwise.
          gethomepage.dev/href: "https://memini.${SECRET_DOMAIN}/"
        hostnames:
          - "memini.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Since v0.7 the web UI has its own port; agents keep the API and
          # MCP surface on the main port.
          - matches:
              - path: { type: PathPrefix, value: /v1/ }
              - path: { type: PathPrefix, value: /mcp }
              - path: { type: Exact, value: /healthz }
              - path: { type: Exact, value: /readyz }
            backendRefs:
              - identifier: main
                port: http
          - backendRefs:
              - identifier: main
                port: ui
    serviceMonitor:
      main:
        enabled: true
