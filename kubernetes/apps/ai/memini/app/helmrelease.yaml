---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 30m
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_DISTILL_ON_WRITE: "true"
              # Embeddings from the Ollama host (OpenAI-compatible API); the
              # reranker stays in-cluster (llmkube), Ollama has no rerank API.
              MEMINI_EMBED_BASE_URL: http://ai.local.jaimenet.com:11434/v1
              MEMINI_EMBED_MODEL: qwen3-embedding:4b
              MEMINI_EMBED_DIMS: "2560"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              # Ollama unloads an idle model after 5 min, and a cold load of
              # the embedding model takes about 7 s. The defaults (5 s write,
              # 2 s recall) then store writes without vectors and drop recall
              # to keyword search.
              MEMINI_WRITE_EMBED_TIMEOUT: 15s
              MEMINI_RECALL_EMBED_TIMEOUT: 10s
              # Consolidation (contradictions, distillation) through LiteLLM,
              # where all models are managed. qwen3:8b thinks before it answers,
              # so it needs a larger token budget and time on these GPUs.
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: ollama/local
              MEMINI_LLM_MAX_TOKENS: "8192"
              MEMINI_DISTILL_TIMEOUT: 180s
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_LLM_API_KEY
                    # memini keeps running without consolidation until the
                    # 1Password field exists.
                    optional: true
              MEMINI_RERANK: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080/v1
              MEMINI_RERANK_MODEL: qwen3-reranker
              MEMINI_LOG_FORMAT: json
              MEMINI_RECALL_MIN_SEMANTIC_SCORE: "0.46"
              MEMINI_TOMBSTONE_TTL: 720h
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
    persistence:
      data:
        existingClaim: memini
    route:
      internal:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: memini
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/description: Long-term memory for AI agents
          # Homepage takes the path of the first rule (/v1/) otherwise.
          gethomepage.dev/href: "https://memini.${SECRET_DOMAIN}/"
        hostnames:
          - "memini.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Since v0.7 the web UI has its own port; agents keep the API and
          # MCP surface on the main port.
          - matches:
              - path: { type: PathPrefix, value: /v1/ }
              - path: { type: PathPrefix, value: /mcp }
              - path: { type: Exact, value: /healthz }
              - path: { type: Exact, value: /readyz }
            backendRefs:
              - identifier: main
                port: http
          - backendRefs:
              - identifier: main
                port: ui
    serviceMonitor:
      main:
        enabled: true
