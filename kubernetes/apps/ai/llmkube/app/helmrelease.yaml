---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 30m
  values:
    namespace: ai
    crds:
      install: true
      keep: true
    controllerManager:
      replicaCount: 1
      leaderElection:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 78Mi
        limits:
          memory: 90Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      enabled: false
    modelCache:
      enabled: true
      size: 20Gi
      # ceph-block (RWO) only attaches on one node at a time: the controller
      # and model-serving pods share this cache PVC but have no affinity to
      # colocate on the same node, so whichever one lands elsewhere (e.g.
      # after a node reboot) gets stuck on FailedAttachVolume forever. The
      # chart's own values.yaml recommends an RWX class for multi-node
      # clusters; ceph-filesystem (CephFS) is that class here.
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      mountPath: /models
