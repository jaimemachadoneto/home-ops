---
# Jeff is an agent on the Paperclip VM (10.30.70.5). He reads the cluster to
# find problems and proposes fixes as tasks. The role gives get, list and watch
# only. It has no Secrets and no ConfigMaps, because an app can keep a value in
# a ConfigMap that an agent must not see. It has no pods/exec, so Jeff cannot
# run a command in a pod. Do not add a verb that changes the cluster.
# Get the token with: kubectl -n ai get secret jeff-readonly-token
#   -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jeff-readonly
---
# A long-lived token for a client outside the cluster. The cluster fills it in.
# To revoke it, delete this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: jeff-readonly-token
  annotations:
    kubernetes.io/service-account.name: jeff-readonly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jeff-readonly
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - events
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups:
      - fluxcd.controlplane.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - source.extensions.fluxcd.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, clusterissuers, issuers]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list, watch]
  - apiGroups: [volsync.backube]
    resources: [replicationsources, replicationdestinations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jeff-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jeff-readonly
subjects:
  - kind: ServiceAccount
    name: jeff-readonly
    namespace: ai
