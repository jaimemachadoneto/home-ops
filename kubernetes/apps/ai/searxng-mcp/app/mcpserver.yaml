---
# Web search through the existing SearXNG (kubernetes/apps/selfhosted/searxng).
# mcp-searxng serves Streamable HTTP when MCP_HTTP_PORT is set (the image this
# replaced was stdio-only and exited at once). In-cluster only, behind the
# LiteLLM gateway, so no bearer token of its own.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: searxng-mcp
spec:
  alias: web_search
  workload:
    # renovate: datasource=docker depName=docker.io/isokoliuk/mcp-searxng
    image: docker.io/isokoliuk/mcp-searxng:2.10.1
    port: 8000
    path: /mcp
    env:
      - name: SEARXNG_URL
        value: http://searxng.selfhosted.svc.cluster.local:8080
      - name: MCP_HTTP_PORT
        value: "8000"
      - name: MCP_HTTP_HOST
        value: 0.0.0.0
      # LiteLLM opens a new MCP session for each tool list. The image default
      # of 20 initializes per minute is too low. It answers 429, and the
      # gateway retries for 15 s before it drops this server. Only the
      # gateway reaches this server, so a high limit is safe.
      - name: MCP_RATE_INIT_MAX
        value: "600"
      - name: MCP_RATE_SESSION_MAX
        value: "6000"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
