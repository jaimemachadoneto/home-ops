---
# The Paperclip VM (10.30.70.5) runs agents as Sandbox pods in the namespace
# paperclip-casa. Its rights are in
# kubernetes/apps/paperclip-casa/sandbox-tenant/app/rbac.yaml.
# Get the token with: kubectl -n ai get secret paperclip-controller-token
#   -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip-controller
---
# A long-lived token for a client outside the cluster. The cluster fills it in.
# To revoke it, delete this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: paperclip-controller-token
  annotations:
    kubernetes.io/service-account.name: paperclip-controller
type: kubernetes.io/service-account-token
