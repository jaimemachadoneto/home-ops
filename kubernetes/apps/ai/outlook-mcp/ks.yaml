---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: outlook-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: outlook-mcp
  components:
    # The Microsoft sign-in (MSAL token cache) lives on this volume.
    - ../../../../components/volsync
  dependsOn:
    - name: litellm-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: "./kubernetes/apps/ai/outlook-mcp/app"
  postBuild:
    substitute:
      APP: outlook-mcp
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
