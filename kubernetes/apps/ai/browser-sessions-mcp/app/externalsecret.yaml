---
# Bearer tokens of the browser-sessions sessions offered through the LiteLLM
# MCP gateway. 1Password item `browser-sessions-mcp`: one field per session,
# named exactly like the session (`colegio`), holding the token the admin UI
# showed when the session was created or its token rotated. Every field
# becomes a key of this Secret.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-sessions-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: browser-sessions-mcp-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: browser-sessions-mcp
