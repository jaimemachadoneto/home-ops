---
# Bearer tokens of the browser-sessions sessions offered through the LiteLLM
# MCP gateway: one field per session in the app's own 1Password item
# `browser-sessions`, named exactly like the session, holding the token the
# admin UI showed when the session was created or its token rotated.
# Listed one by one (not dataFrom) so the item's other secrets (cookie key,
# OIDC client secret) never reach this namespace. Add a line per session.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-sessions-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: browser-sessions-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: colegio
      remoteRef:
        key: browser-sessions
        property: colegio
