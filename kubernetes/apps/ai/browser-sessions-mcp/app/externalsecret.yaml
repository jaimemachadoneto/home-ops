---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-sessions-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: browser-sessions-mcp-secret
    creationPolicy: Owner
  data:
    # Bearer token of the `colegio` session, copied from the browser-sessions
    # admin UI into this field of its 1Password item.
    - secretKey: token
      remoteRef:
        key: browser-sessions
        property: litellm_mcp_token
