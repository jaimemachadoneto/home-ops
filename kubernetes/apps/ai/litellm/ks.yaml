---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm
  # The cluster litellm-postgres holds the database (components/cnpg).
  # ../postgres adds its roles.
  components:
    - ../../../../components/cnpg/pg18
    - ../postgres
  dependsOn:
    - name: dragonfly-cluster
      namespace: database
    - name: cloudnative-pg-barman-cloud
      namespace: database
    - name: litellm-operator
  interval: 1h
  path: "./kubernetes/apps/ai/litellm/app"
  postBuild:
    substitute:
      APP: litellm
      CNPG_DATABASE: litellm
      CNPG_INSTANCES: "2"
      CNPG_OWNER: litellm
      CNPG_PASSWORD_ITEM: LiteLLM
      CNPG_PASSWORD_PROPERTY: db_password
      CNPG_PDB: "true"
      # The backup of the 290 MB database ran out of memory at 256Mi.
      CNPG_SIDECAR_MEMORY_LIMIT: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m
  wait: false
