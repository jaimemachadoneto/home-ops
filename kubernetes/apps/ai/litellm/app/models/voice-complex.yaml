---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: voice-complex
spec:
  # The complex route of voice-router: a request that needs tools, several
  # steps, or the state of the house. A device command that the router will not
  # act on also comes here, so this model must be able to call the Assist API.
  #
  # Cost: $0.30 input and $1.20 output per million tokens at peak, half of that
  # off-peak, the same as voice-chat. The pro model costs four times as much for
  # a route that mostly answers one question or runs a tool; flash is enough.
  #
  # The name is the default of the Home Assistant component
  # (DEFAULT_COMPLEX_MODEL). If this entry is missing, the component is refused
  # with 400 and the request falls back to the built-in agent.
  modelName: voice-complex
  params:
    model: deepseek/deepseek-flash
    apiBase: https://api.deepseek.com/v1
    apiKeyRef:
      name: litellm
      key: DEEPSEEK_API_KEY
    # Reasoning on: this route takes the requests that need several steps or a
    # choice the words cannot make, so the extra work pays for itself here.
    # Web search through the gateway. This route already holds the Assist API
    # tools, so it can act on the house; the search tool adds what happens
    # outside it.
    additional:
      mcp_servers:
        - web_search
      reasoning_effort: high
  info:
    maxInputTokens: 1000000
    maxOutputTokens: 393216
    supportsFunctionCalling: true
