---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-flash-api
spec:
  # DeepSeek's own API, billed by DeepSeek. The group `deepseek-flash` is the
  # same model on the OpenCode Go subscription, billed there. Both groups stay,
  # because the two providers bill separately.
  modelName: deepseek/deepseek-flash
  params:
    model: deepseek/deepseek-flash
    apiBase: https://api.deepseek.com/v1
    apiKeyRef:
      name: litellm
      key: DEEPSEEK_API_KEY
  info:
    maxTokens: 393216
    supportsFunctionCalling: true
