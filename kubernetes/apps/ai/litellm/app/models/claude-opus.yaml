---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-opus
spec:
  # Claude Code tier "opus" on the Claude subscription. No key on purpose:
  # LiteLLM forwards the OAuth token (sk-ant-oat) that Claude Code sends.
  # When it fails (usage limit), the fallbacks in the LiteLLM UI go to
  # OpenCode Go.
  modelName: opus
  params:
    model: anthropic/claude-opus-5-5
