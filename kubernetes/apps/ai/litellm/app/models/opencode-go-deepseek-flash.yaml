---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-deepseek-flash
spec:
  # The group name shows the provider, so the cost reports show who bills the
  # request. `deepseek-flash` is the old name of this group; remove it when
  # every client uses this name. When the group fails, the fallback in the
  # LiteLLM UI goes to opr/deepseek-v4.1-flash (OpenRouter, paid).
  modelName: opencode-go/deepseek-flash
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKeyRef:
      name: opencode-go
      key: OPENCODE_GO_API_KEY
    # OpenCode Go refuses a request without this header (MissingSessionID),
    # and the proxy does not forward the client's headers.
    additional:
      extra_headers:
        x-opencode-session: litellm-opencode-go-deepseek-flash
