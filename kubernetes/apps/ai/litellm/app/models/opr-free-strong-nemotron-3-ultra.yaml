---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opr-free-strong-nemotron-3-ultra
spec:
  # Deployment 1 of the "opr-free-strong" group. The router tries the orders in
  # ascending order, with the most capable model first. A rate limit or an
  # error goes to the next deployment. All deployments share OPENROUTER_API_KEY.
  modelName: opr-free-strong
  params:
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    apiKeyRef:
      name: litellm
      key: OPENROUTER_API_KEY
    additional:
      order: 1
  info:
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
