---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: ollama-chat
spec:
  # Ollama host ai.local.${SECRET_DOMAIN}; `ollama list` there shows what is
  # pulled. qwen3.5:4b uses about 3 GB, so it fits on one GTX 1660 SUPER.
  modelName: ollama/local
  params:
    model: ollama/qwen3.5:4b
    apiBase: http://ai.local.${SECRET_DOMAIN}:11434
    # With thinking, qwen3.5:4b fills the 4096-token context of Ollama and
    # returns no answer. Without it, it answers in seconds.
    additional:
      reasoning_effort: none
  info:
    supportsFunctionCalling: true
