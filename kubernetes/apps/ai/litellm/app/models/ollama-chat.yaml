---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: ollama-chat
spec:
  # Ollama host ai.local.${SECRET_DOMAIN}; `ollama list` there shows what is
  # pulled. qwen3:8b uses about 5 GB, so it fits on one GTX 1660 SUPER.
  # Without thinking, it keeps the correct memory in the memini tests, and
  # qwen3.5:4b does not.
  modelName: ollama/local
  params:
    model: ollama/qwen3:8b
    apiBase: http://ai.local.${SECRET_DOMAIN}:11434
    # With thinking, a qwen3 model can fill the 4096-token context of Ollama
    # and return no answer. Without it, it answers in seconds.
    additional:
      reasoning_effort: none
  info:
    supportsFunctionCalling: true
