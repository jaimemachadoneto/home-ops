---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: litellm-cost-dashboard
    files:
      - litellm-cost.json
  # The AI stack: the GPUs of the ai host, the embedding servers and the
  # requests through LiteLLM. It lives next to the LiteLLM dashboard because
  # the LiteLLM panels are its largest part.
  - name: ai-stack-dashboard
    files:
      - ai-stack.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: "AI"
  labels:
    grafana_dashboard: "true"
