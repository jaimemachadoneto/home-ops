---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm
    creationPolicy: Owner
    template:
      data:
        DEEPSEEK_API_KEY: "{{ .deepseek_API_KEY }}"
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        # Encrypts credentials LiteLLM stores in its database. Never change it
        # once set, or those credentials become unreadable.
        LITELLM_SALT_KEY: "{{ .litellm_salt_key }}"
        # Same password as the CNPG role (database/cloudnative-pg/cluster/litellm.yaml).
        DATABASE_URL: "postgresql://litellm:{{ .litellm_db_password }}@postgres16-rw.database.svc.cluster.local:5432/litellm"
        # Authentik OIDC client (blueprints/oidc.yaml reads the same field).
        GENERIC_CLIENT_SECRET: "{{ .litellm_oidc_client_secret }}"
  dataFrom:
    - extract:
        key: LiteLLM
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: deepseek
      rewrite:
        - regexp:
            source: "(.*)"
            target: "deepseek_$1"
