---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
    # Per worker; the litellm role is capped at 40 connections.
    database_connection_pool_limit: 10
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
    set_verbose: false
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: dragonfly.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_SALT_KEY
    # Keys, users, teams, SSO sessions and spend logs (CNPG postgres16).
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    # Dashboard sign-in with Authentik (provider "litellm" in
    # authentik/app/blueprints/oidc.yaml). Only authentik Admins may sign in
    # and they get proxy_admin through the litellm_role claim. The master
    # key still signs in at /fallback/login if Authentik is down.
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://sso.${SECRET_DOMAIN}/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://sso.${SECRET_DOMAIN}/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://sso.${SECRET_DOMAIN}/application/o/userinfo/
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
