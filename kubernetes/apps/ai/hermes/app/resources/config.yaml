---
# Managed infrastructure overlay; profile preferences remain on the PVC.
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      # The Authentik provider "hermes" (selfhosted/authentik/app/blueprints/oidc.yaml).
      issuer: https://sso.${SECRET_DOMAIN}/application/o/hermes/
      scopes: openid profile email offline_access
  public_url: https://hermes-dash.${SECRET_DOMAIN}

gateway:
  multiplex_profiles: true

security:
  redact_secrets: true

# See ADR 0001 and ADR 0008 in hermes-k8s. Each session runs its shell in its
# own sandbox. The Hermes image includes the plugin k8s_sandbox. The sandbox
# gets no environment variable of Hermes, so env_passthrough is empty.
terminal:
  backend: k8s_sandbox
  cwd: /workspace
  env_passthrough: []
  lifetime_seconds: 1800

telemetry:
  shared_metrics:
    enabled: false
    send: false

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.${SECRET_DOMAIN}
