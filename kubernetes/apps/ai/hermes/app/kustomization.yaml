---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./serviceaccount.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
      - ./resources/gitconfig
      - ./resources/profiles.sh
      - ./resources/state-sync.sh
      - task-tiers-plugin.yaml=./resources/task-tiers/plugin.yaml
      - task-tiers.py=./resources/task-tiers/__init__.py
  # The SOUL.md seed of each profile. profiles.sh copies a seed only when it
  # creates the profile.
  - name: hermes-personas
    files:
      - ./resources/personas/soul-default.md
      - ./resources/personas/soul-dev.md
      - ./resources/personas/soul-house.md
      - ./resources/personas/soul-infra.md
      - ./resources/personas/soul-kid.md
      - ./resources/personas/soul-research.md
generatorOptions:
  disableNameSuffixHash: true
