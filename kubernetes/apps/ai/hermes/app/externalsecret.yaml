---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: "{{ .hermes_API_SERVER_KEY }}"
        # The Authentik client (selfhosted/authentik/app/blueprints/oidc.yaml
        # reads the same field).
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .hermes_OIDC_CLIENT_SECRET }}"
        # The jaimeagents token, for the features of Hermes itself: the Skills Hub, its
        # git clones, the Kanban PR check and its MCP servers. The sandboxes get the
        # tokens from their own Secret (hermes-sandbox/sandbox-tenant, ADR 0008).
        GH_TOKEN: "{{ .hermes_GITHUB_TOKEN }}"
        GITHUB_TOKEN: "{{ .hermes_GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes
      rewrite:
        # The 1Password type "API Credential" adds the field "valid from". A
        # Secret key cannot have a space.
        - regexp:
            source: "[^a-zA-Z0-9_]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "hermes_$1"
---
# The LiteLLM key is a file, not an environment variable. The secret command
# of each Hermes profile reads it (see README.md).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-litellm
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: hermes
        property: LITELLM_API_KEY
---
# This is the pull secret of the Hermes image. The image is private on
# ghcr.io. The token comes from the field pat_ghcr_pull of the 1Password
# item Github. The Secret ghcr-pull of hermes-sandbox uses the same field.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"jaimemachado","password":"{{ .token }}","auth":"{{ printf "jaimemachado:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: Github
        property: pat_ghcr_pull
