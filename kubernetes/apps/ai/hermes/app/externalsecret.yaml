---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: "{{ .hermes_API_SERVER_KEY }}"
        # The Authentik client (selfhosted/authentik/app/blueprints/oidc.yaml
        # reads the same field).
        HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .hermes_OIDC_CLIENT_SECRET }}"
        # The jaimeagents token. gh reads GH_TOKEN, and other tools read
        # GITHUB_TOKEN.
        GH_TOKEN: "{{ .hermes_GITHUB_TOKEN }}"
        GITHUB_TOKEN: "{{ .hermes_GITHUB_TOKEN }}"
        # The jaimemachadoneto token. git uses it for the repositories of that
        # owner (resources/gitconfig).
        GITHUB_TOKEN_PERSONAL: "{{ .hermes_GITHUB_TOKEN_PERSONAL }}"
  dataFrom:
    - extract:
        key: hermes
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hermes_$1"
---
# The LiteLLM key is a file, not an environment variable. The secret command
# of each Hermes profile reads it (see README.md).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-litellm
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: hermes
        property: LITELLM_API_KEY
