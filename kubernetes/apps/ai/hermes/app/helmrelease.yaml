---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        # The Role of this account is in the namespace hermes-sandbox. When
        # KUBECONFIG is not set, the plugin reads the mounted token.
        serviceAccount:
          name: hermes-sandbox-client
        pod:
          # The token goes only to the container app, as a projected volume
          # (persistence.sa-token). The Dashboard has no token.
          automountServiceAccountToken: false
          # The package of the Hermes image is private on ghcr.io.
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        containers:
          app:
            image: &image
              repository: ghcr.io/jaimemachadoneto/hermes
              tag: h3ci28bajyp5@sha256:52bf673856ea3d92dcc49a61819f8259b58643634412a25c9f563c19b25fc213
            env: &env
              # The login directory of `claude`, on the volume. HOME is
              # /opt/data, so this is also the default directory.
              CLAUDE_CONFIG_DIR: /opt/data/.claude
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # The sandbox image, pinned by digest. The admission policy of
              # hermes-sandbox refuses an image with no digest.
              HERMES_K8S_SANDBOX_IMAGE: ghcr.io/jaimemachadoneto/hermes-sandbox:y2iwr4mjg4pn@sha256:bc56a0949f68efd3ba28e63a83a9e1b00e73a4ea0b8fef9816b228e038912f73
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
              # git picks the GitHub token by the owner of the repository (see
              # resources/gitconfig). A system file, so `git config --global` still works.
              GIT_CONFIG_SYSTEM: /etc/hermes/gitconfig
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 110m
                memory: 1536Mi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # The Nix image has no s6, so the gateway does not start the Dashboard.
          # A second container starts the Dashboard from the same image and the same volume.
          dashboard:
            image: *image
            # args replaces the command of the image, not its entrypoint (tini).
            args:
              - hermes
              - dashboard
              - --host
              - 0.0.0.0
              - --port
              - "9119"
              - --no-open
            env: *env
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            dashboard:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
            dashboard:
              - path: /etc/hermes
                readOnly: true
      litellm-key:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
            dashboard:
              - path: /mnt/secrets/litellm
                readOnly: true
      claude-token:
        type: secret
        name: hermes-claude
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/claude
                readOnly: true
      sa-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        advancedMounts:
          hermes:
            app:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # The gateway checks that TERMINAL_CWD (/workspace) exists. The path
      # exists only in the sandbox pod, so without this directory the gateway
      # writes an error to the log every 2 seconds. No command runs here.
      workspace:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /workspace
    route:
      webapp:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes agent
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/name: Hermes
          gethomepage.dev/app: hermes
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9120
            timeouts:
              request: 0s
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes administration
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/name: Hermes Dashboard
          gethomepage.dev/app: hermes
        hostnames:
          - hermes-dash.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
    service:
      app:
        ports:
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
