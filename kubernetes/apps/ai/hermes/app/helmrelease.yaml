---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  # A release pulls an image of about 1 GB, and the init steps then prepare
  # each profile. With the default of 5m, Helm rolled back v0.0.10 of
  # hermes-k8s before the pod was ready.
  timeout: 15m
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        # The Role of this account is in the namespace hermes-sandbox. When
        # KUBECONFIG is not set, the plugin reads the mounted token.
        serviceAccount:
          name: hermes-sandbox-client
        pod:
          # The token goes only to the container app, as a projected volume
          # (persistence.sa-token). The Dashboard has no token.
          automountServiceAccountToken: false
          # The package of the Hermes image is private on ghcr.io.
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        containers:
          app:
            # The kubelet is the supervisor of the gateway. A restart from the
            # Dashboard makes the gateway exit, and the kubelet starts the
            # container again (hermes-k8s ADR 0012).
            args:
              - hermes
              - gateway
              - run
              - --external-supervisor
            image: &image
              repository: ghcr.io/jaimemachadoneto/hermes
              tag: sha-321da0410c2ada7c3f4e9ef9d725a5a9a62afed0@sha256:1b7872d183339fc9ebbb3c323f30f8f5b6b64bafd12f2a2225906e42ae7333e1
            env: &env
              # The login directory of `claude`, on the volume. HOME is
              # /opt/data, so this is also the default directory.
              CLAUDE_CONFIG_DIR: /opt/data/.claude
              # Only the Dashboard reads it. The Dashboard is in another PID
              # namespace and cannot see the gateway process, so it asks the
              # API server of the gateway for the status.
              GATEWAY_HEALTH_URL: http://127.0.0.1:8642
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # The sandbox image, pinned by digest. The admission policy of
              # hermes-sandbox refuses an image with no digest.
              HERMES_K8S_SANDBOX_IMAGE: ghcr.io/jaimemachadoneto/hermes-sandbox:sha-321da0410c2ada7c3f4e9ef9d725a5a9a62afed0@sha256:ba14ce92599ecf73323796aea6a6a57ce446c5b4ecf8b58571046b5f68567c96
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
              # git in this pod uses GITHUB_TOKEN for each repository (see
              # resources/gitconfig). A system file, so `git config --global` still works.
              GIT_CONFIG_SYSTEM: /etc/hermes/gitconfig
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 110m
                memory: 1536Mi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # The Nix image has no s6, so the gateway does not start the Dashboard.
          # A second container starts the Dashboard from the same image and the same volume.
          dashboard:
            image: *image
            # args replaces the command of the image, not its entrypoint (tini).
            args:
              - hermes
              - dashboard
              - --host
              - 0.0.0.0
              - --port
              - "9119"
              - --no-open
            env: *env
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9119
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Copies the text configuration of each profile to a private GitHub
          # repository each hour (resources/state-sync.sh). Only this container
          # has the personal GitHub token.
          state-sync:
            image:
              repository: docker.io/alpine/git
              tag: v2.54.1@sha256:29cff25811f790b9f72fc266bf8009a5a911714c0e03c31c47339c50909d9aef
            command:
              - /bin/sh
              - /etc/hermes/state-sync.sh
            env:
              HOME: /work
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        # These run after the containers block only so that they can use its
        # YAML anchors. Kubernetes runs them in order, before the containers.
        initContainers:
          # A restore or a node restart can leave the root of the volume
          # owned by root. fsGroup fixes only the group, and the gateway
          # refuses a control path that uid 10000 does not own.
          fix-owner:
            image: *image
            command:
              - /bin/chown
              - "10000"
              - /opt/data
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: false
              runAsUser: 0
              capabilities:
                add:
                  - CHOWN
                drop:
                  - ALL
          # Seeds the persona profiles once and sets their cluster paths
          # (resources/profiles.sh).
          profiles:
            dependsOn: fix-owner
            image: *image
            command:
              - /bin/sh
              - /etc/hermes/profiles.sh
            env: *env
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            dashboard:
              - path: /opt/data
            fix-owner:
              - path: /opt/data
            profiles:
              - path: /opt/data
            state-sync:
              - path: /opt/data
                readOnly: true
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
            dashboard:
              - path: /etc/hermes
                readOnly: true
            profiles:
              - path: /etc/hermes
                readOnly: true
            state-sync:
              - path: /etc/hermes
                readOnly: true
      personas:
        type: configMap
        name: hermes-personas
        advancedMounts:
          hermes:
            profiles:
              - path: /etc/hermes-personas
                readOnly: true
      litellm-key:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
            dashboard:
              - path: /mnt/secrets/litellm
                readOnly: true
            # `hermes config set` runs the secret command of the profile.
            profiles:
              - path: /mnt/secrets/litellm
                readOnly: true
      state-sync-token:
        type: secret
        name: hermes-state-sync
        advancedMounts:
          hermes:
            state-sync:
              - path: /mnt/secrets/state-sync
                readOnly: true
      claude-token:
        type: secret
        name: hermes-claude
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/claude
                readOnly: true
      sa-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        advancedMounts:
          hermes:
            app:
              - path: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # The gateway checks that TERMINAL_CWD (/workspace) exists. The path
      # exists only in the sandbox pod, so without this directory the gateway
      # writes an error to the log every 2 seconds. No command runs here.
      workspace:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /workspace
      # The clone of the hermes-state repository. A new pod clones it again.
      state-sync-work:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          hermes:
            state-sync:
              - path: /work
    route:
      webapp:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes agent
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/name: Hermes
          gethomepage.dev/app: hermes
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9120
            timeouts:
              request: 0s
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Hermes administration
          gethomepage.dev/group: AI
          gethomepage.dev/icon: mdi-robot-outline
          gethomepage.dev/name: Hermes Dashboard
          gethomepage.dev/app: hermes
        hostnames:
          - hermes-dash.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
    service:
      app:
        ports:
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
