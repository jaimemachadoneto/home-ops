---
# The kubesearch MCP server has no login of its own. Only the LiteLLM MCP
# gateway can call it. The policy has no egress rule, because the server
# downloads from GitHub and clones public repositories.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubesearch-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubesearch-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The kubelet probes come from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
