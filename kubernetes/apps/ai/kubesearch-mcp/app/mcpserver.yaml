---
# The kubesearch MCP server through the LiteLLM MCP gateway. It searches the
# Flux HelmReleases of public home-ops repositories (kubesearch.dev). It
# downloads its SQLite databases from GitHub into /data, and it can clone a
# public repository, so it needs the internet.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  alias: kubesearch
  workload:
    # renovate: datasource=docker depName=ghcr.io/perfectra1n/kubesearch-mcp
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0
    port: 3000
    automountServiceAccountToken: false
    # The cache is lost at a restart. The first call downloads it again in a
    # few seconds.
    volumes:
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi
