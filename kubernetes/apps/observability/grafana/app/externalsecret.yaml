---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    template:
      data:
        admin-user: "{{ .grafana_username }}"
        admin-password: "{{ .grafana_password }}"
  dataFrom:
    - extract:
        key: grafana
      rewrite:
        - regexp:
            source: "(.*)"
            target: "grafana_$1"
---
# Same password as the litellm_grafana CNPG role. Add grafana_db_password to
# the LiteLLM 1Password item before reconciling this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-litellm-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-litellm-db
    creationPolicy: Owner
    template:
      data:
        password: "{{ .grafana_db_password }}"
  data:
    - secretKey: grafana_db_password
      remoteRef:
        key: LiteLLM
        property: grafana_db_password
