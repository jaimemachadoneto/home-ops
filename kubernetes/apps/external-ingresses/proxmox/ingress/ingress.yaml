---
# Proxmox serves HTTPS with a self-signed certificate. A BackendTLSPolicy
# cannot skip the check, so an Envoy Backend does it, as for kasm.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: proxmox-backend
spec:
  endpoints:
    - ip:
        address: 10.30.3.2
        port: 8006
    - ip:
        address: 10.30.3.3
        port: 8006
    - ip:
        address: 10.30.3.4
        port: 8006
    - ip:
        address: 10.30.3.5
        port: 8006
  tls:
    insecureSkipVerify: true
---
# A Proxmox login is valid on one node only, so a session stays on the same
# node. A node that does not answer gets the next attempt.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: proxmox
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: proxmox
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: proxmox-route
        ttl: 48h
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - reset
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
  annotations:
    gethomepage.dev/description: "Proxmox Virtual Environment"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "si-proxmox.svg"
    gethomepage.dev/name: "Proxmox"
    gethomepage.dev/widget.password: "${PROXMOX_SECRET}"
    gethomepage.dev/widget.type: "proxmox"
    gethomepage.dev/widget.url: "https://proxmox.${SECRET_DOMAIN}"
    gethomepage.dev/widget.username: "${PROXMOX_TOKENID}"
spec:
  hostnames:
    - proxmox.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: proxmox-backend
