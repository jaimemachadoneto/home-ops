---
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# NOTE: v8's `include: - template:` directive resolves against a separate,
# currently-empty "config includes" registry, not the config-templates repo's
# full profile templates. So the templates below (sqp-1-2160p / web-1080p)
# are embedded directly, mirroring:
#   https://github.com/recyclarr/config-templates/blob/master/radarr/templates/sqp/sqp-1-2160p.yml
#   https://github.com/recyclarr/config-templates/blob/master/sonarr/templates/web-1080p.yml
sonarr:
  sonarr:
    base_url: http://sonarr.downloads.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats

radarr:
  radarr:
    base_url: http://radarr.downloads.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: sqp-streaming
    quality_profiles:
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee # [Unwanted] Unwanted Formats SQP
