---
# With socketLB.hostNamespaceOnly, Cilium translates a pod-to-Service flow per
# packet. When coredns runs on the node of the client, its DNS reply arrives as
# a new ingress flow, and each pod that has an ingress policy drops it
# (syncthing dropped about 9,000 replies in 24 hours). This policy allows that
# reply for every pod. enableDefaultDeny false: the policy only adds an allow
# rule, so a pod with no other policy keeps all its ingress open.
# No toPorts: the reply goes to an ephemeral port.
# shortcut: coredns pods may also open connections to any pod; remove this
# policy if Cilium tracks same-node Service replies again.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-same-node-dns-replies
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
