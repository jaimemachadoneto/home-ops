---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: l2-announce-healthcheck
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: l2-announce-healthcheck
  interval: 1h
  path: "./kubernetes/apps/kube-system/l2-announce-healthcheck/app"
  prune: true
  # No targetNamespace: this app's manifests span kube-system (the CronJob
  # and its Lease RBAC) and network (RBAC to read Services there), each
  # namespaced explicitly on the resource itself.
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
  # No postBuild.substituteFrom: this app doesn't reference ${SECRET_DOMAIN}
  # or any other cluster-secrets variable, and the healthcheck script below
  # is full of literal ${...} bash expansions that Flux's envsubst-based
  # substitution would otherwise try (and fail) to resolve.
