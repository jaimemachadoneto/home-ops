---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  install:
    crds: CreateReplace
  interval: 1h
  upgrade:
    crds: CreateReplace
  values:
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      nodeSelector:
        gpu: intel
      # xpumd is not deployed in this cluster; without it the plugin panics
      # trying to reach its health-check socket (ghcr.io/intel chart v0.12.0+).
      # privileged is required so the driver reads hardware details directly
      # instead of through xpumd when health monitoring is off.
      privileged: true
      healthMonitoring:
        enabled: false
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "gpu"
          effect: "NoExecute"
        - key: "node.kubernetes.io/gpu"
          operator: "Exists"
          effect: "NoSchedule"
