---
# The seed of the Nix base: volumesnapshot.yaml takes its snapshot. No pod
# mounts it. It is a cache: a new empty volume only makes each run install
# Nix and download the packages again, so it has no volsync backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arc-jmn-nix-store
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ceph-block
