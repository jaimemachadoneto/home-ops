---
# The GitHub App of the scale set, from the same 1Password item as the one
# in actions-runner-system. This app has its own copy, so that it does not
# depend on the app arc-jmn-docker.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-jmn-nix
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-jmn-nix-secret
    creationPolicy: Owner
    template:
      data:
        github_app_id: "{{ .arc_github_app_id }}"
        github_app_installation_id: "{{ .arc_github_app_installation_id }}"
        github_app_private_key: "{{ .arc_github_app_private_key }}"
  dataFrom:
    - extract:
        key: actions-runner-controller
      rewrite:
        - regexp:
            source: "(.*)"
            target: "arc_$1"
