---
# Org runners with a Docker daemon, for jobs that build or run images and
# for jobs with service containers. Use `runs-on: arc-jmn-docker`. The
# arc-jmn set stays in kubernetes mode, with no privilege.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-jmn-docker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  driftDetection:
    mode: enabled
  values:
    githubConfigUrl: https://github.com/jaimemachadoneto
    githubConfigSecret: actions-runner-controller-secret

    minRunners: 0
    maxRunners: 3

    # The chart adds a privileged dind sidecar and points DOCKER_HOST at it.
    containerMode:
      type: dind

    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system

    template:
      metadata:
        labels:
          app.kubernetes.io/name: arc-jmn-docker-runner
      spec:
        # One runner on each node. On 2026-11-20 the runners of a devBase CI
        # run filled the disk of home-ops-00, and the kubelet stopped the
        # control plane of that node.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            # home-ops-03 has the GPU taint, so it is not a place for a runner.
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: arc-jmn-docker-runner
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.2@sha256:2dd7caa094a425c041539447cb0e6ae63cda10b5242773764683b695b8fa5613
            command:
              - /home/runner/run.sh
            # The chart gives the dind sidecar no resources. The kubelet
            # compares the disk use of the whole pod (the Docker data of
            # dind and the emptyDir volumes too) with the sum of the
            # container limits, so this limit evicts the runner pod before
            # the node runs short of disk.
            resources:
              limits:
                cpu: "2.0"
                memory: "6Gi"
                ephemeral-storage: "20Gi"
              requests:
                cpu: "1.0"
                memory: "2Gi"
                ephemeral-storage: "5Gi"
