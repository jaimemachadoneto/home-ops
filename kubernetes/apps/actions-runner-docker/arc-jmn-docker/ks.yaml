---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-jmn-docker
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: arc-jmn-docker
  # The controller in actions-runner-system owns the CRDs and starts the
  # runner pods of every scale set.
  dependsOn:
    - name: actions-runner-controller
      namespace: actions-runner-system
  interval: 1h
  path: "./kubernetes/apps/actions-runner-docker/arc-jmn-docker/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner-docker
  timeout: 5m
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
