---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-29
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true

  backup:
    retentionPolicy: 31d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cloudnative/
      endpointURL: http://nas.jaimenet.com:9000
      # Archive this cluster writes to. Bump it (v0 -> v1) whenever the
      # cluster is re-created: CNPG refuses to archive into a non-empty path.
      # Procedure in docs/offsite-backup.md, "Restore procedures > Postgres".
      serverName: postgres16-v0
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: s3-key
        secretAccessKey:
          name: cloudnative-pg-secret
          key: s3-secret
  # A new or re-created cluster always restores from the object store,
  # never starts empty. CNPG only reads `bootstrap` when it creates the
  # cluster, so this does nothing to the running one. If the archive cannot
  # be read the bootstrap fails instead of handing apps an empty database.
  bootstrap:
    recovery:
      source: &previousCluster postgres16-v0
  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster
