---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-29
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      # Authentik's embedded outpost opens a pool of up to 4 connections per
      # forward-auth app per server pod, and leaks pools after a Postgres
      # restart or switchover (387 connections on 2026-10-07). Idle
      # connections cost a few MB each; see the role cap below.
      max_connections: "800"
      shared_buffers: 256MB
  # Roles CNPG keeps in shape. Only attributes are managed here: without
  # passwordSecret the passwords (set by each app's postgres-init) are left
  # alone. Omitted attributes are reset to defaults, so list what matters.
  managed:
    roles:
      # Authentik. Capped so a connection leak cannot starve the other apps
      # (CNPGAuthentikConnectionsHigh warns at 400).
      - name: user
        ensure: present
        login: true
        inherit: true
        connectionLimit: 500
      # LiteLLM (litellm.yaml). Its pool is 10 per worker; the cap keeps it
      # well inside the budget whatever it does.
      - name: litellm
        ensure: present
        login: true
        inherit: true
        connectionLimit: 40
        passwordSecret:
          name: litellm-db-credentials

  # PodDisruptionBudget on the primary (CNPG's default, explicit here): a
  # drain waits for a switchover instead of evicting the primary.
  enablePDB: true
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 4Gi

  # WAL archiving and base backups go through the Barman Cloud plugin into
  # the ObjectStore postgres16-nas (objectstore.yaml, retention 31d).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres16-nas
        # Archive this cluster writes to. Bump it (v0 -> v1) whenever the
        # cluster is re-created: Barman refuses to archive into a non-empty
        # path. Procedure in docs/offsite-backup.md, "Restore procedures >
        # Postgres".
        serverName: postgres16-v0

  # A new or re-created cluster always restores from the object store,
  # never starts empty. CNPG only reads `bootstrap` when it creates the
  # cluster, so this does nothing to the running one. If the archive cannot
  # be read the bootstrap fails instead of handing apps an empty database.
  bootstrap:
    recovery:
      source: &previousCluster postgres16-v0
  externalClusters:
    - name: *previousCluster
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres16-nas
          serverName: *previousCluster
