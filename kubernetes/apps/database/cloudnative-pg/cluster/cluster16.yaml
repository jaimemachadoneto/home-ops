---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-29
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true

  # WAL archiving and base backups go through the Barman Cloud plugin into
  # the ObjectStore postgres16-nas (objectstore.yaml, retention 31d).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres16-nas
        # Archive this cluster writes to. Bump it (v0 -> v1) whenever the
        # cluster is re-created: Barman refuses to archive into a non-empty
        # path. Procedure in docs/offsite-backup.md, "Restore procedures >
        # Postgres".
        serverName: postgres16-v0

  # A new or re-created cluster always restores from the object store,
  # never starts empty. CNPG only reads `bootstrap` when it creates the
  # cluster, so this does nothing to the running one. If the archive cannot
  # be read the bootstrap fails instead of handing apps an empty database.
  bootstrap:
    recovery:
      source: &previousCluster postgres16-v0
  externalClusters:
    - name: *previousCluster
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres16-nas
          serverName: *previousCluster
