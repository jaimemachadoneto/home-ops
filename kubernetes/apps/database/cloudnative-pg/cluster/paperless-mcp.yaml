---
# Database of the Paperless MCP server (paperless-mcp), for its search index.
# The role is declared in cluster16.yaml (managed.roles, password from this
# Secret). The app's DATABASE_URL must use the same 1Password field.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-mcp-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: paperless_mcp
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: Paperless
        property: paperless_mcp_db_password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: paperless-mcp
spec:
  cluster:
    name: postgres16
  name: paperless_mcp
  owner: paperless_mcp
  ensure: present
  # The app does not run as a superuser, so it cannot create the extensions
  # itself. The operator creates them, and the app's migration then finds them.
  extensions:
    - name: vector
      ensure: present
    - name: unaccent
      ensure: present
  # Dropping this resource must never drop the data.
  databaseReclaimPolicy: retain
