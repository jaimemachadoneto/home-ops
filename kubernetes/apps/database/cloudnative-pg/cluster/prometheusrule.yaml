---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: CNPGConnectionsHigh
          annotations:
            description: '{{ $labels.pod }} uses {{ $value | humanizePercentage }} of max_connections. New connections fail when it is full; see which role holds them with pg_stat_activity.'
            summary: Postgres connections above 80% of max_connections
          expr: |-
            sum by (namespace, pod) (cnpg_backends_total{namespace="database", pod=~"postgres16-[0-9]+"})
              / on (namespace, pod) max by (namespace, pod) (cnpg_pg_settings_setting{namespace="database", pod=~"postgres16-[0-9]+", name="max_connections"})
              > 0.8
          for: 5m
          labels:
            severity: warning
        - alert: CNPGAuthentikConnectionsHigh
          annotations:
            description: Authentik holds {{ $value }} Postgres connections (cap 500, normally under 100). Its embedded outpost leaks connection pools after a Postgres restart or switchover. Fix with `kubectl -n selfhosted rollout restart deploy/authentik-server deploy/authentik-worker`.
            summary: Authentik is leaking Postgres connections
          expr: |-
            sum by (namespace) (cnpg_backends_total{namespace="database", pod=~"postgres16-[0-9]+", usename="user"}) > 400
          for: 5m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: PGVolumeSpaceLow
          annotations:
            description: PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 20% disk space available. If this reaches 0, PostgreSQL will crash-loop.
            summary: A postgres16 PVC is running low on disk space
          expr: |-
            kubelet_volume_stats_available_bytes{namespace="database", persistentvolumeclaim=~"postgres16-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="database", persistentvolumeclaim=~"postgres16-.*"} < 0.20
          for: 15m
          labels:
            severity: warning
    - name: cloudnative-pg-backup.rules
      rules:
        - alert: CNPGNoRecentBackup
          annotations:
            description: The newest base backup of {{ $labels.namespace }}/postgres16 is {{ $value | humanizeDuration }} old (expected one per day). Check the ScheduledBackup, the Backup objects and the MinIO bucket.
            summary: No successful postgres base backup in over 26 hours
          expr: |-
            time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"postgres16-[0-9]+"}) > 26 * 3600
          for: 15m
          labels:
            severity: critical
        - alert: CNPGBackupMetricsMissing
          annotations:
            description: Prometheus has no backup metrics for the postgres16 cluster, so backup age cannot be checked. The cluster or its PodMonitor may be down.
            summary: Postgres backup metrics are missing
          expr: |-
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"postgres16-[0-9]+"})
          for: 1h
          labels:
            severity: critical
        - alert: CNPGLastBackupFailed
          annotations:
            description: The most recent base backup of {{ $labels.namespace }}/postgres16 failed and no backup has succeeded since.
            summary: Postgres base backup failed
          expr: |-
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="database", pod=~"postgres16-[0-9]+"})
              > max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", pod=~"postgres16-[0-9]+"})
          for: 15m
          labels:
            severity: critical
        - alert: CNPGWalArchivingStalled
          annotations:
            description: No WAL segment has been shipped to the object store for {{ $value | humanizeDuration }}. Point-in-time recovery is falling behind; check the ContinuousArchiving condition on the cluster.
            summary: Postgres WAL archiving has stalled
          # min across pods selects the primary; replicas do not archive
          expr: |-
            min by (namespace) (cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="database", pod=~"postgres16-[0-9]+"}) > 3600
          for: 15m
          labels:
            severity: critical
