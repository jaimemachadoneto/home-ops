---
# LiteLLM's database (keys, users, SSO sessions, spend logs) on postgres16.
# The role is declared in cluster16.yaml (managed.roles, password from this
# Secret); the app's DATABASE_URL is built from the same 1Password field in
# kubernetes/apps/ai/litellm/app/externalsecret.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: litellm
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: LiteLLM
        property: db_password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
spec:
  cluster:
    name: postgres16
  name: litellm
  owner: litellm
  ensure: present
  # Dropping this resource must never drop the data.
  databaseReclaimPolicy: retain
