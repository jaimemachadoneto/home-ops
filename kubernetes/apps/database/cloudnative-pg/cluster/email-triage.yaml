---
# Database of the email triage service. The role is declared in cluster16.yaml
# (managed.roles, password from this Secret). The app's DATABASE_URL is built
# from the same 1Password field in
# kubernetes/apps/ai/email-triage/app/externalsecret.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-triage-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: email-triage-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: email_triage
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: email-triage
        property: db_password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: email-triage
spec:
  cluster:
    name: postgres16
  name: email_triage
  owner: email_triage
  ensure: present
  # Dropping this resource must never drop the data.
  databaseReclaimPolicy: retain
