---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudnative-pg
spec:
  interval: 12h
  provider: generic
  ref:
    # Pinned: chart 0.29.1 is operator 1.30.1. Operator 1.31 removes the
    # in-tree barmanObjectStore. postgres16 now backs up through the Barman
    # Cloud plugin; unpin once that is verified in the cluster
    # (docs/backlog.md, item 3).
    tag: 0.29.1
  # Select the gzipped Helm chart layer so the source controller
  # extracts the correct content instead of attempting to unpack
  # non-gzip layers (fixes: "requires gzip-compressed body: gzip: invalid header").
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
