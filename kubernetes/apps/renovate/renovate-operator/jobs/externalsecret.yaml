---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-assistant-pem
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lab-assistant-pem
  data:
    - secretKey: private_key_pem
      remoteRef:
        key: Github
        property: lab_assistant_app_key
---
# The secret of the GitHub webhook that starts a Renovate run. GitHub signs
# each delivery with it (X-Hub-Signature-256), and the operator refuses a
# call without a valid signature. The same value is in the webhook settings
# of the repository on GitHub.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-token
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-webhook-token
  data:
    - secretKey: token
      remoteRef:
        key: Github
        property: renovate_webhook_token
