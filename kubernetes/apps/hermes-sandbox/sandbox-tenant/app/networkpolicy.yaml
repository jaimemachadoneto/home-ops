---
# A sandbox gets no ingress. The Hermes pod reaches it through pods/exec of
# the API server, not through the pod network. This policy also removes all
# egress, so that ciliumnetworkpolicy.yaml is the only list of allowed egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-sandbox-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Egress
    - Ingress
