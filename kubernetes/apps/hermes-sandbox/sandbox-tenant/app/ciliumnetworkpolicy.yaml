---
# The base egress of each sandbox: DNS names in the cluster and the Nix cache.
# A sandbox has no internet: the allowance "internet"
# (ciliumnetworkpolicy-internet.yaml) gives it. A sandbox needs its own policy
# to reach another service.
# That policy selects the label hermes-k8s/allow-<service>=true. There is no
# ingress rule.
# The Hermes plugin sets that label in the Sandbox. The admission policy
# accepts only the label keys of the known allowances. When you add an
# allowance policy, add its key to the admission policy.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-base
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            # Only names in the cluster: kube-dns forwards other names to the
            # internet, so a query can carry data out.
            dns:
              - matchPattern: "**.cluster.local"
    # The Nix cache (ncps, namespace system). The cache has the matching
    # ingress rule.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nix-cache
            k8s:io.kubernetes.pod.namespace: system
      toPorts:
        - ports:
            - port: "8501"
              protocol: TCP
