---
# The base egress of each sandbox: DNS, SearXNG, the Nix cache and the
# internet without the private ranges. A sandbox needs its own policy to
# reach another service.
# That policy selects the label hermes-k8s/allow-<service>=true. There is no
# ingress rule.
# The Hermes plugin sets that label in the Sandbox. The admission policy
# accepts only the label keys of the known allowances. When you add an
# allowance policy, add its key to the admission policy.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-sandbox-base
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The Nix cache (ncps, namespace system). The rule below excludes the pod
    # network. The cache therefore needs its own rule. The cache has the
    # matching ingress rule.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nix-cache
            k8s:io.kubernetes.pod.namespace: system
      toPorts:
        - ports:
            - port: "8501"
              protocol: TCP
    # The excluded ranges include the pod network (10.244.0.0/16) and the
    # service network (10.96.0.0/12). The ranges also include the home
    # network. The sandboxes cannot reach the API server or the home network.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 224.0.0.0/4
            - 240.0.0.0/4
