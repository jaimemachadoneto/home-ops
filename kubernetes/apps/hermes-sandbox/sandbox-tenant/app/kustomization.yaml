---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./ciliumnetworkpolicy-internet.yaml
  - ./ciliumnetworkpolicy-litellm.yaml
  - ./externalsecret.yaml
  - ./limits.yaml
  - ./networkpolicy.yaml
  - ./nix-base.yaml
  - ./rbac.yaml
  - ./validatingadmissionpolicy.yaml
# One pod template serves the CronJob and the Job.
replacements:
  - source:
      kind: CronJob
      name: hermes-nix-base
      fieldPath: spec.jobTemplate.spec.template
    targets:
      - select:
          kind: Job
          name: hermes-nix-base
        fieldPaths:
          - spec.template
