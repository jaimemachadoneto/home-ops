---
# The pull secret of the sandbox image, which is private on ghcr.io. Only the
# token is a secret: it comes from the field pat_ghcr_pull of the 1Password
# item Github. The admission policy allows only this Secret name as an
# imagePullSecret.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"jaimemachado","password":"{{ .token }}","auth":"{{ printf "jaimemachado:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: Github
        property: pat_ghcr_pull
---
# The GitHub tokens of the default profile of Hermes. The plugin mounts this
# Secret read-only at /run/secrets/github in the sandbox pod (ADR 0008 of
# hermes-k8s). So no token is in an exec request. The name is
# hermes-sandbox-<profile>, and the admission policy allows only this pattern.
# Add one ExternalSecret for each other profile.
# GH_TOKEN and GITHUB_TOKEN are the jaimeagents token. GITHUB_TOKEN_PERSONAL
# is the jaimemachadoneto token, which git uses for that owner.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sandbox-default
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-sandbox-default
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .github }}"
        GITHUB_TOKEN: "{{ .github }}"
        GITHUB_TOKEN_PERSONAL: "{{ .personal }}"
  data:
    - secretKey: github
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN
    - secretKey: personal
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN_PERSONAL
---
# The GitHub tokens of the dev profile of Hermes, the same tokens as
# default. The plugin mounts this Secret read-only at /run/secrets/github in the sandbox pod (ADR 0008 of
# hermes-k8s). So no token is in an exec request. The name is
# hermes-sandbox-<profile>, and the admission policy allows only this pattern.
# GH_TOKEN and GITHUB_TOKEN are the jaimeagents token. GITHUB_TOKEN_PERSONAL
# is the jaimemachadoneto token, which git uses for that owner.
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sandbox-dev
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-sandbox-dev
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .github }}"
        GITHUB_TOKEN: "{{ .github }}"
        GITHUB_TOKEN_PERSONAL: "{{ .personal }}"
        # The cluster account of the Renovate loop (renovate-identity.yaml).
        # Use it with KUBECONFIG=/run/secrets/github/kubeconfig.
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: home-ops
              cluster:
                server: https://kubernetes.default.svc.cluster.local
                certificate-authority-data: {{ .kube_ca | b64enc }}
          users:
            - name: hermes-dev-renovate
              user:
                token: {{ .kube_token }}
          contexts:
            - name: home-ops
              context:
                cluster: home-ops
                user: hermes-dev-renovate
          current-context: home-ops
  data:
    - secretKey: kube_token
      sourceRef:
        storeRef:
          kind: SecretStore
          name: hermes-sandbox-kube
      remoteRef:
        key: hermes-dev-renovate-token
        property: token
    - secretKey: kube_ca
      sourceRef:
        storeRef:
          kind: SecretStore
          name: hermes-sandbox-kube
      remoteRef:
        key: hermes-dev-renovate-token
        property: ca.crt
    - secretKey: github
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN
    - secretKey: personal
      remoteRef:
        key: hermes
        property: GITHUB_TOKEN_PERSONAL
