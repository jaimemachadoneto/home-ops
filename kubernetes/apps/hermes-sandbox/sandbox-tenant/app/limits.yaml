---
# Room for six sandboxes and one Nix base Job. The requests are small, because most
# sandboxes are idle. The limits allow six sandbox pods. Each pod has one container at the
# maximum size. The count of Sandbox objects is limited, because the pod quota does not
# limit the objects that the controller reads. The Job pod needs one more pod and one more
# volume of 20Gi (the quota counts the ephemeral volume of the pod), and its `warm` step
# requests 500m of CPU, 2Gi of memory and 2Gi of ephemeral storage. The limits of this step
# are 4 CPU and 8Gi of memory. The requests have 1 CPU and 2Gi of memory of room, so a change
# of the default request of a sandbox does not block the Job.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-sandbox-quota
spec:
  hard:
    pods: "7"
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.cpu: "28"
    limits.memory: 56Gi
    persistentvolumeclaims: "21"
    ceph-block.storageclass.storage.k8s.io/requests.storage: 420Gi
    count/volumesnapshots.snapshot.storage.k8s.io: "30"
    requests.ephemeral-storage: 14Gi
    count/sandboxes.agents.x-k8s.io: "20"
---
# The quota on requests.ephemeral-storage refuses a container with no request.
# This range gives each container a default request. The maximum CPU and
# memory are the same as in the Paperclip tenant. The defaults are higher.
apiVersion: v1
kind: LimitRange
metadata:
  name: hermes-sandbox-limits
spec:
  limits:
    - default:
        cpu: "4"
        ephemeral-storage: 4Gi
        memory: 8Gi
      defaultRequest:
        cpu: 250m
        ephemeral-storage: 2Gi
        memory: 1Gi
      max:
        cpu: "4"
        ephemeral-storage: 4Gi
        memory: 8Gi
      type: Container
