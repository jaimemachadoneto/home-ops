---
# Room for six sandboxes. The requests are small, because most sandboxes are
# idle. The limits allow six pods at the maximum of one container.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-sandbox-quota
spec:
  hard:
    pods: "6"
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: "24"
    limits.memory: 48Gi
    persistentvolumeclaims: "20"
    ceph-block.storageclass.storage.k8s.io/requests.storage: 400Gi
    count/volumesnapshots.snapshot.storage.k8s.io: "30"
    requests.ephemeral-storage: 12Gi
---
# The quota on requests.ephemeral-storage refuses a container with no request,
# so this range gives each container a default. The CPU and memory values
# are the same as the ones of the Paperclip tenant, with a higher limit.
apiVersion: v1
kind: LimitRange
metadata:
  name: hermes-sandbox-limits
spec:
  limits:
    - default:
        cpu: "4"
        ephemeral-storage: 4Gi
        memory: 8Gi
      defaultRequest:
        cpu: 250m
        ephemeral-storage: 2Gi
        memory: 1Gi
      max:
        cpu: "4"
        ephemeral-storage: 4Gi
        memory: 8Gi
      type: Container
