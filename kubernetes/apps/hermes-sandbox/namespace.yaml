---
# Each Hermes session runs in this namespace. Each session is a Sandbox pod that the
# Hermes pod (namespace ai) creates through the agent-sandbox controller. The
# pods run untrusted agent commands, so the restricted profile is enforced.
# k8tz does not inject an init container. The pods need no local time zone,
# and an init container slows the start of a session.
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    k8tz.io/inject: "false"
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
