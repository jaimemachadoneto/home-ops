---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 30m
  releaseName: ceph-csi-drivers
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Driver ServiceAccounts/RBAC are owned by this chart per the rook v1.20
    # upgrade guide: https://github.com/rook/rook/blob/master/Documentation/Upgrade/rook-upgrade.md#ceph-csi-drivers-chart
    # The rook-ceph-cluster chart already creates and manages the matching
    # OperatorConfig (with correct replica/priorityClass/resources defaults)
    # and Driver CRs, so leave those alone here and only own the driver RBAC.
    operatorConfig:
      create: false
    drivers:
      rbd:
        name: rook-ceph.rbd.csi.ceph.com
        enabled: true
      cephfs:
        name: rook-ceph.cephfs.csi.ceph.com
        enabled: true
      nvmeof:
        enabled: false
      nfs:
        enabled: false
