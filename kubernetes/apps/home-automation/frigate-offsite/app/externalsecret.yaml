---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-offsite
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-offsite-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The same rclone config (and Onedrive-Jaime remote) the selfhosted
        # rclone CronJobs use, so there is one OneDrive login to maintain.
        rclone.conf: |
          {{ .rclone_conf }}
        MQTT_USERNAME: "{{ .frigate_offsite_mqtt_username }}"
        MQTT_PASSWORD: "{{ .frigate_offsite_mqtt_password }}"
  dataFrom:
    - extract:
        key: rclone
      rewrite:
        - regexp:
            source: "(.*)"
            target: "rclone_$1"
    # 1Password item with fields mqtt_username / mqtt_password.
    - extract:
        key: frigate-offsite
      rewrite:
        - regexp:
            source: "(.*)"
            target: "frigate_offsite_$1"
