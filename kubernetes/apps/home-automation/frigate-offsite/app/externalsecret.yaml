---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-offsite
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-offsite-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Own rclone config with the Onedrive-Frigate remote, so the Frigate
        # OneDrive account does not depend on the selfhosted rclone CronJobs.
        rclone.conf: |
          {{ .frigate_offsite_rclone_conf }}
        MQTT_USERNAME: "{{ .frigate_offsite_mqtt_username }}"
        MQTT_PASSWORD: "{{ .frigate_offsite_mqtt_password }}"
  dataFrom:
    # 1Password item with fields rclone_conf / mqtt_username / mqtt_password.
    - extract:
        key: frigate-offsite
      rewrite:
        - regexp:
            source: "(.*)"
            target: "frigate_offsite_$1"
