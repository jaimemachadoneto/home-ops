---
# Speech to text for Home Assistant (Wyoming). The model downloads at the
# first start into /opt/stacks/fast-wir-2/whisper-data.
services:
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper-ptbr
    restart: unless-stopped
    ports:
      - 10300:10300
    volumes:
      # Absolute: doco-cd runs compose from its own copy of the repository,
      # and a ./ path would be an empty folder there.
      - /opt/stacks/fast-wir-2/whisper-data:/data
    environment:
      - TZ=Europe/Madrid
    command:
      - --model
      - large-v3-turbo
      - --language
      - pt
      - --device
      - cuda
      - --compute-type
      - float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
