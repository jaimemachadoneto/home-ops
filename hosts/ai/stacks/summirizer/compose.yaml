services:
  summarizer:
    container_name: summarizer
    image: python:3-slim
    ports:
      - 16000:8000
    restart: unless-stopped
    environment:
      - MODEL=llama3
      - MODEL_URL=10.30.3.10:11434
    volumes:
      - /aiservers/openapi-servers/servers/summarizer-tool:/app
    entrypoint: |
      sh -c "
        apt update && 
        apt install -y git &&
        cd /app &&
        pip install -r ./requirements.txt &&
        fastapi run
      "
networks: {}
