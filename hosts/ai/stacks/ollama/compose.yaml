# Ollama uses the GPUs 0 and 1 only. GPU 2 belongs to the embedding servers
# (hosts/ai/stacks/embeddings): they must always fit there. With count: all,
# Ollama loaded qwen3:8b over GPU 1 and GPU 2 for about 5 minutes each hour,
# and took 2.1 GiB of the 6 GiB that the two TEI containers share.
# The models are spread over the two cards. qwen3:8b needs about 5.6 GiB.
version: "3.3"
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities:
                - gpu
    volumes:
      - ollama:/root/.ollama
    ports:
      - 11434:11434
    container_name: ollama
    image: ollama/ollama
    restart: always
volumes:
  ollama: {}
networks:
  openwebui_default:
    external: true
  searxng_searxng:
    external: true
  tika_default:
    external: true
  dockge_default:
    external: true
