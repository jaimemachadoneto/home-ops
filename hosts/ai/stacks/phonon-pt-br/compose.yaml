---
# Text to speech, a test next to the piper stack. The model weights come from
# Hugging Face and need a token: HF_TOKEN is in the .env of this stack on the
# host, never in git. The model cache is in /docker/phonon/cache.
services:
  phonon-tts:
    image: ghcr.io/gradium-ai/ptts-openai-server:latest
    container_name: phonon-tts
    restart: unless-stopped
    volumes:
      - /docker/phonon/cache:/root/.cache/huggingface
    ports:
      - 10.30.50.13:8881:8880
    environment:
      - TZ=Europe/Madrid
      - HF_TOKEN=${HF_TOKEN}
      # phonon-40m-pt or phonon-40m-multilingual
      - PTTS_MODEL=hf://gradium/phonon-40m-pt
      - PTTS_LANG=pt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # GPU 2, next to the two TEI containers. Its own GPU use is not
              # measured: the 1.6 GiB seen on GPU 0 belonged to Whisper
              # (fast-wir-2), not to this stack. It loads the model on the first
              # request. On GPU 0 there is no room: qwen-tts, kokoro and Ollama
              # take about 3.7 GiB there.
              device_ids: ["2"]
              capabilities: [gpu]
