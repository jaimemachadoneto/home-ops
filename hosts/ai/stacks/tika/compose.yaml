# Text extraction for Paperless. The service names no network, so Compose puts
# it in the default network of the project. This file declared 12 external
# networks before, and no service used them; 7 of them do not exist on the host.
# They were removed so that a deploy from doco-cd does not depend on them.
version: "3.3"
services:
  tika:
    ports:
      - 9998:9998
    image: apache/tika:latest-full
    restart: always
