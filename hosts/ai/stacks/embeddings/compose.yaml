---
# Embedding models as dedicated inference servers: one container per model.
# Text Embeddings Inference (TEI) loads the model at start and keeps it in
# GPU memory, so the first query never waits for a load. Ollama unloads an
# idle model, and a cold query then fails the timeout of the Paperless MCP
# server (the search answers with words only). See ../README.md.
#
# The images are pinned by tag and digest. Bump both together, and check the
# CUDA requirement of the new image first:
#   docker inspect <image> | grep NVIDIA_REQUIRE_CUDA
# turing-1.8.3 is the newest Turing build for the driver 570.144 of the host:
# turing-1.9 asks for cuda>=12.9 and the driver answers CUDA 12.8 only. This
# image is experimental, with Flash Attention off, and it needs --dtype
# float16 because bfloat16 needs Ampere or newer.
services:
  tei-qwen3-06b:
    container_name: tei-qwen3-06b
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8.3@sha256:bd102b08fbdb23fa2a0c747c8b2d154c521e3fce20441266c005ad7a101143a0
    restart: unless-stopped
    ports:
      # The host address only: the Paperless MCP server calls it at
      # EMBEDDING_URL. Change this IP with the address of the host.
      - 10.30.50.13:11435:80
    volumes:
      - tei-qwen3-06b-data:/data
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --dtype
      - float16
      - --max-batch-tokens
      - "2048"
      # Qwen3-Embedding declares a max input of 32768 tokens. Without this
      # flag TEI refuses to start when the batch limit is lower. The chunks of
      # the index are about 300 tokens, so the truncation never applies.
      # Keep the batch small: the warmup of TEI runs one full batch, and the
      # attention buffers of 8192 tokens need more than the 6 GB of the card
      # (CUDA_ERROR_OUT_OF_MEMORY at the start).
      - --auto-truncate
      # TEI refuses a request with more than 32 inputs (413) by default. A
      # document of 35 chunks stopped the sync of the Paperless MCP index. The
      # notes server sends up to 96 inputs in one request.
      - --max-client-batch-size
      - "96"
    # Both models share GPU 2 with two tests: fast-wir-2 (Whisper, 1.6 GiB at idle)
    # and phonon-pt-br (its model loads at the first request). Together the TEI
    # containers need about 2.4 GB of the 6 GB. If the card fills, the search
    # falls back to words only. The models of Ollama stay on the other cards.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  # NOT in the TEI supported-model list: BAAI/bge-m3 is an XLM-RoBERTa model
  # with sentence pooling, which TEI supports, but the combination is not
  # tested upstream. Test this container before the notes server uses it.
  # If it refuses the model, keep bge-m3 on Ollama.
  tei-bge-m3:
    container_name: tei-bge-m3
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8.3@sha256:bd102b08fbdb23fa2a0c747c8b2d154c521e3fce20441266c005ad7a101143a0
    restart: unless-stopped
    ports:
      # The host address only, as above.
      - 10.30.50.13:11436:80
    volumes:
      - tei-bge-m3-data:/data
    command:
      - --model-id
      - BAAI/bge-m3
      - --dtype
      - float16
      # Small batch, as for the other container: the warmup of TEI runs one
      # full batch, and 8192 tokens ran out of GPU memory (CUDA_ERROR_OUT_OF_MEMORY)
      # when this container started again with the other model on the same GPU.
      # The chunks of the index are about 300 tokens.
      - --max-batch-tokens
      - "2048"
      # bge-m3 declares a max input of 8192 tokens. Without this flag TEI
      # refuses to start when the batch limit is lower. A chunk has about 512
      # tokens, so the truncation never applies.
      - --auto-truncate
      # The notes server sends up to 16 inputs in one request
      # (TEI_EMBED_BATCH_SIZE), because 96 full-size chunks can exceed its
      # request timeout. TEI refuses more than 32 by default (413).
      - --max-client-batch-size
      - "96"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

volumes:
  tei-qwen3-06b-data: {}
  tei-bge-m3-data: {}
