---
# Runs doco-cd on the AI host: it polls home-ops and redeploys a stack
# whenever a file named in .doco-cd.<target>.yml changes on `main`. The
# targets are in poll-config.yml. See ../README.md.
services:
  doco-cd:
    container_name: doco-cd
    # Pinned by digest: this container holds the docker socket, so a silent
    # replacement of the image is a root-level risk. Bump the digest by hand.
    image: ghcr.io/kimdre/doco-cd:latest@sha256:8ca3cf6701f70ac3af4c5d726e542fe3a854a038149375f87222ec2719b3c975
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      POLL_CONFIG_FILE: /data/poll-config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/doco-cd/data:/data
      # Read-only: the target ai-host-extra reads the .env file of phonon-pt-br
      # and qweanvoice (env_files: /opt/stacks/<name>/.env). Those files hold
      # HF_TOKEN. doco-cd already holds the docker socket, which is root on the
      # host, so this adds little exposure, but a compromise of doco-cd now also
      # reads every file in /opt/stacks.
      - /opt/stacks:/opt/stacks:ro
    # NOT cap_drop: ALL - doco-cd reads host-owned files it does not own.
    # The mounted docker.sock is already root-equivalent on the host.
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
