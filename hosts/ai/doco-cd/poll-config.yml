# Copied to /opt/doco-cd/data/poll-config.yml by the install steps in
# ../README.md. No secrets here: home-ops is a public repo, so doco-cd clones
# over HTTPS and needs no deploy key.
# One entry per stack: add a target here and a .doco-cd.<target>.yml at the
# root of the repo to deploy another stack automatically.
- url: https://github.com/jaimemachadoneto/home-ops.git
  reference: main
  interval: 30m
  target: embeddings
# The other stacks of the host: kokoro and the two exporters. One deploy
# file (.doco-cd.ai-host.yml) with a document for each stack.
- url: https://github.com/jaimemachadoneto/home-ops.git
  reference: main
  interval: 30m
  target: ai-host
# The stacks that need absolute bind mounts and the .env files of the host:
# tika, ocr and fast-wir-2. This target
# needs /opt/stacks mounted read-only into doco-cd (hosts/ai/doco-cd/compose.yaml).
- url: https://github.com/jaimemachadoneto/home-ops.git
  reference: main
  interval: 30m
  target: ai-host-extra
