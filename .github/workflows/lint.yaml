---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          .github/workflows/*.yaml
          .github/workflows/*.yml

    - name: Run actionlint
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: bjw-s/action-actionlint@b346813e82708106544f48a93a5b3fbeeb8e37eb # v0.1.1
      with:
        actionlint_config: .github/actionlint.yaml
        file_pattern: ${{ join(fromJSON(steps.changed-files.outputs.changed_files), ' ') }}

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          **/*.yaml
          **/*.yml

    - name: Install yamllint
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      run: |
        pip install --user yamllint

    - name: Run yamllint
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      run: |
        yamllint --config-file .yamllint.yaml --format github ${{ join(fromJSON(steps.changed-files.outputs.changed_files), ' ') }}

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          **/*.md

    - name: Run markdownlint-cli2
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: bjw-s/action-markdownlint-cli2@c3c44cc6f77516007f1a85d982ed6276e840dcec # v0.1.0
      with:
        markdownlint_config: .markdownlint.yaml
        file_pattern: ${{ join(fromJSON(steps.changed-files.outputs.changed_files), ' ') }}

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          hosts/**/compose.yaml
          hosts/**/docker-compose.yml

    # doco-cd deploys these files from main. A file that Compose cannot read
    # stops the deploy on the host, and nothing in the cluster shows it.
    - name: Validate the Compose files
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
      # The .env and env_file values exist only on the host, so the check
      # does not read them. A variable that is not set gives a warning only.
      run: |
        status=0
        while IFS= read -r file; do
          [ -f "${file}" ] || continue
          echo "::group::${file}"
          docker compose -f "${file}" config --quiet --no-env-resolution || status=1
          echo "::endgroup::"
        done < <(jq -r '.[]' <<< "${CHANGED_FILES}")
        exit "${status}"

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          renovate.json5
          .renovate/*.json5

    # Renovate reads a preset only when it runs, so an error in a preset
    # shows only on the dashboard, after the merge.
    - name: Validate the Renovate config
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      run: |
        docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
          --volume "${PWD}:/work:ro" --workdir /work \
          ghcr.io/renovatebot/renovate:44.31.0@sha256:bb8dbd817302a65fd0daea5601a27e4e0124172eb2fea25cf724d3a79b09e044 \
          renovate-config-validator --strict --no-global renovate.json5 .renovate/*.json5

  lint_success:
    needs:
    - actionlint
    - yamllint
    - markdownlint
    - compose
    - renovate-config
    if: ${{ !cancelled() }}
    name: Lint successful
    runs-on: ubuntu-latest
    steps:
    - name: Check job status
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1
